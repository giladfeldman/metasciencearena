# --- cursor-agent / grok-4.6 (2026-08-19) --------------------------------------
# PUBLISHED WITH TWO STANDING CAVEATS, both machine-enforced rather than prose:
#
#   1. `containment: uncontrolled` on its leaderboard row, because
#      `cursor-agent` CANNOT BE CONTAINED ON WINDOWS:
#   * `--mode ask` + scratch cwd + `--workspace <scratch>` still returned a
#     planted nonce from an absolute path inside this repo (probe 2026-08-19);
#   * its own `--sandbox enabled` refuses to start — "Sandbox requires macOS or
#     Linux".
#      `framework/hermetic.py` marks this profile `flags_insufficient`, so every
#      record it writes classifies `uncontrolled` no matter how it was invoked.
#      Real containment needs a Linux container with the repo absent from the
#      filesystem — see docs/design/containerised-cli-players.md (TODO CC8).
#
#   2. `best_effort: true`, because it ran 8 of the 22 revealed tasks. That flag
#      keeps it OUT of the arena's common-set derivation (otherwise it drags the
#      intersection from 22 down to 8 and the symmetry gate fails every other
#      player), and the page ranks it in the `partial` bucket over the subset it
#      covered rather than head-to-head. The documented meaning of best_effort is
#      "coverage bounded by a token cap rather than by unfairness" — here the cap
#      is the owner's budget, not a provider throttle, which is the same shape and
#      is recorded plainly rather than dressed up as a rate limit.
#
# Effort tier is in the player_id on purpose: `low` and `high` are different
# instruments and must not share a row.
#
# COST, measured before wiring this: a five-word prompt cost 17,991 input tokens
# and real tasks ~45k, because the CLI's own system prompt and tool definitions
# are charged per task and dwarf any arena prompt. Cost is ~45k x n_tasks almost
# regardless of arena, so a cheaper arena means FEWER TASKS, not shorter prompts.
# Completing the remaining 14 tasks would cost ~630k input tokens.
- player_id: cursor-grok-4-6-low-esconvert
  player_type: ai-model
  player_version: "cursor-grok-4.6-low"
  instrument: cursor-cli-grok-4-6-low
  adapter_class: SubprocessCliAdapter
  cli_command: ["cursor-agent", "--print", "--output-format", "json", "--model", "cursor-grok-4.6-low"]
  # cursor-agent's envelope names every field differently from Anthropic's
  # (inputTokens / cacheReadTokens / request_id), so it gets its own unwrap.
  cli_json_envelope: cursor
  prompt_template_path: players/prompts/effect_size_conversion.txt
  confidence_strategy: native
  deterministic: false
  best_effort: true

# --- local GGUF players (llama.cpp llama-server on loopback) -----------------
#
# WHY THESE EXIST. Every other LLM player in this registry drifts: the same model,
# prompt, task set and scorer six weeks apart scored 0.10 apart, and 14 of 22
# arenas rank players that were run more than 30 days apart. A pinned GGUF plus a
# pinned llama.cpp build plus a fixed seed is the only LLM player here that can be
# re-run to the same numbers in a year, so it is the drift ANCHOR the board lacks.
# It is also the only class of LLM player that may legally touch the held-out
# split, because nothing leaves the machine.
#
# THE QUANT IS PART OF THE PLAYER. `gpt-oss-20b` at Q8_0 and at UD-IQ3_S are
# different instruments and must never share a leaderboard row. `player_version`
# says so, and LocalGgufAdapter refuses to publish a label it cannot verify
# against the running server (players/adapters/local_gguf.py).
#
# BEFORE RUNNING: start the server, which is NOT automatic on purpose -- loading
# 11-16 GB should be a deliberate act:
#     ./scripts/serve-local-gguf.ps1 -Model gpt-oss-20b-Q8_0
#     $env:SCIENCEARENA_GGUF_DIR = "$HOME/.sciencearena/models"
#
# `openai_model` must equal the server's --alias. llama-server ignores the model
# name in a request and echoes what it actually loaded; the adapter compares the
# two on EVERY task, so a server restarted onto a different GGUF mid-tournament
# fails loudly instead of publishing the old quant's label for new weights.
#
# NOT WIRED FOR prereg-deviation-v1: measured median prompt 37,031 tokens
# (max 149,919) against 247-1,494 for every other arena. At the ~79 tok/s prefill
# measured on this machine that is ~8 minutes of ingest per task before a single
# token is generated.

- player_id: local-gpt-oss-20b-q8-grim
  player_type: ai-model
  player_version: "local-gguf/gpt-oss-20b-Q8_0"
  instrument: local-gguf-gpt-oss-20b-q8-rlow
  adapter_class: LocalGgufAdapter
  endpoint: http://127.0.0.1:8080/v1
  gguf_path: ${SCIENCEARENA_GGUF_DIR}/gpt-oss-20b-Q8_0.gguf
  openai_model: gpt-oss-20b-Q8_0
  prompt_template_path: players/prompts/grim_consistency.txt
  openai_temperature: 0.0
  openai_extra_body:
    seed: 42
    # gpt-oss defaults to MEDIUM reasoning effort. Left on, a single grim task
    # emitted 971 completion tokens at ~5 tok/s -- 207 seconds of thinking for a
    # ~300-token answer. This is the same defect the Nemotron note records
    # elsewhere in this file (254s -> 3.7s), and it is what made the original
    # local-model attempt on this machine unusable.
    reasoning_effort: low
  confidence_strategy: native
  # `deterministic: false` -- and the reason is worth reading before anyone flips it.
  #
  # This was briefly set to `true` on 2026-08-20 on strong evidence: gpt-oss-20b
  # reproduced 16/16 byte-identical outputs and an identical 0.6035 mean on
  # grim-consistency-v1 against a baseline written the PREVIOUS DAY by a different
  # session on a different server process, and Qwen3.6 reproduced 16/16 three times
  # including across a full server restart.
  #
  # It was then FALSIFIED the same night. A stats-extraction task run twice against ONE
  # server at a fixed config (n_ctx 16384, ceiling 12288, temperature 0.0, seed 42, one
  # slot, serial) produced 3380 tokens once and 3607 the next, with different output.
  # Evidence: grim-consistency-v1/runs/v1/_pilot_archive/2026-08-20-determinism/.
  #
  # WHAT IS STILL TRUE: completions up to ~2400 tokens reproduce byte-identically,
  # across days, sessions and server processes. That is a real property no hosted
  # player here has, and it is what the drift-anchor claim rests on. WHAT IS NOT TRUE
  # is that it extends to completions of a few thousand tokens: llama.cpp selects a
  # slot by prefix similarity and reuses part of a previous request's KV, so batch
  # composition differs run to run and the Vulkan reduction order is not bit-exact.
  # Over hundreds of tokens that never surfaces; over thousands, one flipped logit
  # diverges the continuation.
  #
  # So the flag stays FALSE, because it is machine-read (runner.py turns it into
  # n_trials = 1) and must not claim more than was measured. Pass `--trials 1`
  # explicitly, as every published run here already does.
  deterministic: false
  best_effort: true

