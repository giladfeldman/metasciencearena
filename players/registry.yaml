# =============================================================================
# ARTIFACT RETENTION (standing directive, 2026-08-13)
# Every run MUST record its prompt-template hash, tokens, provider metadata and
# our own code version. See docs/RUN_ARTIFACT_RETENTION.md. When adding a player:
#   - OpenAI-compatible: usage + response_meta come for free via the shared adapter
#   - reasoning models (Nemotron 3.x): set openai_extra_body enable_thinking:false
#     or expect ~200x the tokens and 100x the latency
#   - add the model to framework/pricing.py at its LIST price (free != $0)
# =============================================================================
- player_id: statcheck
  player_type: tool
  # <package>-<version>, matching every other R tool. The bare "1.5.0" this
  # replaced passed the drift check only by numeric coincidence (the detected
  # "statcheck-1.5.0" happens to contain it), not by design.
  player_version: "statcheck-1.5.0"
  instrument: statcheck-1-5-0
  adapter_class: RCliAdapter
  r_script: players/adapters/statcheck.R
  confidence_strategy: implicit-1.0
  deterministic: true

# metacheck (scienceverse) tool player — one RCliAdapter that branches on the
# envelope's arena_id (players/adapters/metacheck.R). Wires metacheck's REAL module
# families across FIVE arenas (deterministic offline + bundled offline reference
# DBs RetractionWatch/FLoRA + live PubPeer API; LLM path skipped, no API key):
