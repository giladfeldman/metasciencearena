# caps prompt + max_tokens at 8000 tokens per request; the 56-entry reference
# list alone needs ~12k output tokens, so every ceiling the free tier accepts
# truncates real answers (measured: 20 of 23 launch tasks HTTP 413). A paid tier
# is not an option (portfolio rule), and a truncating ceiling would publish a
# score for our configuration, not the model.
