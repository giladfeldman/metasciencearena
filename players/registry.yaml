- player_id: escimate
  player_type: platform
  maintainer_coi: true   # built and maintained by the arena maintainer; see framework/registry.py
  # 2026-08-21: 0.6.13 -> 0.7.6. THIRTEEN releases, including changed verdict
  # semantics (new impossible-value guards refuse a negative SE and a reversed
  # CI; eta2_p/omega2_p now parse). This string is an INTENT, not evidence:
  # start_app.bat:74-81 reinstalls the package whenever effectcheck/DESCRIPTION
  # differs from what is installed, so leaving it at 0.6.13 would have executed
  # 0.7.6 and stamped the record 0.6.13 on a player marked deterministic: true.
  # HttpAdapter.resolved_tool_version() now reads the version the SERVICE
  # reports (plumber.R computes it from packageVersion()), and `framework audit`
  # compares the two — so this line can no longer drift silently.
  #
  # The 0.6.13 records are NOT deleted: they are in
  # runs/v2/_archive/2026-08-21-escimate-0.6.13-superseded-by-0.7.6/. They must
  # not sit beside the new ones, because build-data.mjs keys leaderboard rows on
  # player_id ALONE (scripts/build-data.mjs:395,421 — playerVersions is a
  # Map<player_id, version> whose last write wins), so two versions in one runs
  # dir are averaged into a single row labelled with whichever file was read last.
  player_version: "0.7.6"
  instrument: escimate-0-7-6
  adapter_class: HttpAdapter
  endpoint: http://127.0.0.1:9422/api/v1/process-text
  # ${ESCIMATE_APP_DIR} is resolved at run time by
  # framework.player_adapter.resolve_start_command: the environment first, then
  # the gitignored players/local_paths.yaml. It is a placeholder rather than a
  # path for TWO reasons. (1) Never hardcode a user path — the portfolio root
  # moved out of Dropbox on 2026-08-03 and this entry silently rotted. (2) This
  # file is on framework/publish.py's public allowlist, so a launcher path here
  # discloses the directory layout of a private repository to anyone reading the
  # public mirror. An unset placeholder RAISES and names itself; it never
  # silently survives into the command.
  start_command: ["cmd", "/c", "${ESCIMATE_APP_DIR}/start_app.bat"]
  confidence_strategy: implicit-1.0
  deterministic: true

# escimate 0.7.10 — A NEW INSTRUMENT, NOT A RELABEL OF THE ENTRY ABOVE.
#
# MEASURED 2026-09-21, end to end through framework.player_adapter.build_adapter
# on the live 0.7.6 registry entry above. Negative control first: a /health probe
# REFUSED the connection, so nothing stale was already listening on 9422 and the
# reading below can only come from the process prepare() started. Positive
# control: the launch had to succeed AND the service had to return an
# extraction, because a version string read from a service that answered
# nothing is not evidence.
#
#   prepare() OK in 12.2s; service up: True
#   play_task extractions : 1
#   resolved_tool_version : 0.7.10        <- what the SERVICE reports
#   engine_versions       : effectcheck 0.7.10, R 4.4.0, statcheck 1.5.0,
#                           effectsize 1.0.2, MBESS 4.9.41
#
# The ESCImate source bumped to 0.7.10 on 2026-09-11 — verified at the source,
# one commit touching effectcheck/DESCRIPTION, found with `git log -S` rather
# than read off a changelog. (The commit is not cited here: this file is
# mirrored publicly and that repository is private.) start_app.bat
# reinstalls the R package whenever effectcheck/DESCRIPTION differs from what is
# installed — so every launch from now on EXECUTES 0.7.10.
#
# WHY A SECOND ENTRY AND NOT AN EDIT. The 216 published records under the id
# above were produced by 0.7.6, and all 216 carry
# provenance.resolved_tool_version "0.7.6" — the service's own self-report,
# measured 2026-09-21, not the declared string. player_version is a label
# stamped at WRITE time, so editing it does not re-describe those runs, it
# mislabels them: it would attribute 0.7.6's numbers to 0.7.10 on a public
# leaderboard, about a real tool. The fix for a provenance label is a RE-RUN,
# never a relabel. framework/tests/test_provenance_labels.py enforces exactly
# this and goes red on such an edit.
#
# ONE ENDPOINT, ONE INSTALLED PACKAGE. Both entries launch the same script and
# poll the same 127.0.0.1:9422, because this machine has exactly one effectcheck
# install and the launcher keeps it at whatever the source DESCRIPTION says. So
# the entry above is NO LONGER RUNNABLE here: a run of `escimate` today would
# execute 0.7.10 and stamp 0.7.6, and the runner writes the service's own
# self-report into provenance.resolved_tool_version on every record, so
# framework/tests/test_provenance_labels.py goes red on the contradiction.
# `framework audit --versions` now reports it too, but only since 2026-09-21:
# until today HttpAdapter read its version off a task RESPONSE and the audit
# never plays a task, so it printed "[UNCHECKED:undeclared] escimate" while the
# service was demonstrably running 0.7.10. It now probes /health once instead.
# The audit refusing the stale entry is the guard working, not a fault to route
# around — replay its records, never re-run them.
#
# WHEN THIS PLAYER FIRST PUBLISHES A RECORD, in the SAME commit as the run:
# add "escimate-0-7-10" to LABEL_EDGE_PLAYERS in
# framework/tests/test_provenance_labels.py with CORROBORATES True (this HTTP
# adapter self-reports its version), and add the matching provenance-label row
# to the portfolio fleet manifest that file's docstring cites. It is deliberately
# NOT added now: that test carries a non-vacuity control which fails on a player
# with zero published records, and correctly so — a label guard over an empty
# record set is a green that tests nothing.
- player_id: escimate-0-7-10
  player_type: platform
  maintainer_coi: true   # built and maintained by the arena maintainer; see framework/registry.py
  player_version: "0.7.10"
  instrument: escimate-0-7-10
  # THE VERSION LADDER, declared rather than parsed (2026-09-21). One line on the
  # NEWER entry naming the id it replaces. Ordering by the version STRING is not
  # an option: sorted(["0.7.10", "0.7.6"]) == ['0.7.10', '0.7.6'], so a parse
  # calls 0.7.6 the latest on this very pair. A link cannot sort wrong.
  # Checked by framework/identity.py rule D (the link must be capable of being
  # true) and required by unlinked_version_successions() at publication.
  supersedes: escimate
  adapter_class: HttpAdapter
  endpoint: http://127.0.0.1:9422/api/v1/process-text
  # Same placeholder, same reasons as the entry above: ${ESCIMATE_APP_DIR} is
  # resolved at run time from the environment, else the gitignored
  # players/local_paths.yaml, and RAISES naming itself when neither supplies it.
  # This file is on framework/publish.py's public allowlist, so a launcher path
  # written here would disclose a private repository's directory layout.
  start_command: ["cmd", "/c", "${ESCIMATE_APP_DIR}/start_app.bat"]
  confidence_strategy: implicit-1.0
  deterministic: true

