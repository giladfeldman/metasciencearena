# --- pdf-text-fidelity-v1 players ----------------------------------------

# player_version is the human-declared label (also the report-bundle key); the
# AUTHORITATIVE version a score was produced with is `resolved_tool_version`,
# detected at runtime by the adapter and stamped into every run record (see
# framework/player_adapter.py::resolved_tool_version). Keep these in sync with
# the installed package; `python -m framework audit --versions` flags drift.
#
# 2026-08-28: 2.4.136 -> 2.4.137, all four docpluck players. The install had
# moved to the v2.4.137 git tag while these strings still said 2.4.136, so
# `audit --versions` reported DRIFT on all four. The 2.4.136 RECORDS were
# correctly labelled (every one carries resolved_tool_version=docpluck-2.4.136)
# — the danger was prospective, and it is not hypothetical: the first re-run
# done BEFORE this edit wrote player_version=docpluck-2.4.136-sections beside
# resolved_tool_version=docpluck-2.4.137. build-data.mjs:422 publishes
# player_version, so that row would have claimed a version that did not run.
# EDIT THIS FILE FIRST, THEN RE-RUN — the runner stamps the declared label into
# every record at write time, so the order is the whole fix.
#
# What 2.4.137 changes here, measured on all 222 current-board records both
# splits: 3 scores, all in pdf-section-structure-v1's held-out set - +0.0403,
# +0.0303 and -0.0306. THE ACCESSIONS ARE DELIBERATELY NOT NAMED HERE, and
# neither is the one docpluck's release note happens to name: this file ships in
# the PUBLIC MIRROR (it is listed in contract/public_manifest.txt), and
# identifying a held-out paper discloses MEMBERSHIP even without its gold - a
# step toward the contamination the split exists to prevent, and worse beside a
# per-paper delta, which also says how well a tool is doing on it. Naming the
# paper indirectly leaks it just as well as printing the accession, which is why
# the release-note pointer went too. The gate is
# framework/tests/test_public_mirror_names_no_heldout_paper.py.
# This arena is the "external benchmark" docpluck's release note credits with
# finding their greedy span-fill bug. That note claims "0 regressions"; on this
# arena's section metric that does not hold. Text fidelity and tables: 0 of 144
# changed, as expected for a sectioning fix.
#
# The 2.4.136 records are NOT deleted: they are in each arena's
# runs/<v>/_archive/2026-08-28-docpluck-2.4.136-superseded-by-2.4.137/. They
# must not sit beside the new ones — build-data.mjs:480 makes duplicate
# (player, task) pairs FATAL. pdf-text-fidelity-v1 runs/v1 is FROZEN and was
# left untouched; its board keeps 2.4.136 because the label is read from the
# records, not from this file.
#
# 2026-09-11: 2.4.137 -> 2.4.141, all four docpluck players, on Gilad's decision.
# These labels landed in 2bc6954 and the 222 re-scored rows in db5f376, the commit
# IMMEDIATELY AFTER -- not in one commit, which an earlier draft of this paragraph
# claimed. Nothing was published between them and neither was pushed alone, so the
# rule's intent held; the SENTENCE did not, for ~85 minutes. A peer session caught it
# by reading the history against the prose, which is the check this repo asks for and
# which I had not run on my own comment.
#
# AND THEN THE CORRECTION NEEDED CORRECTING, which is the more useful half. I first
# wrote that the false sentence had "shipped to the public mirror", reasoning from
# this file being listed in contract/public_manifest.txt. That inference was wrong,
# and being listed in the manifest means a file is ELIGIBLE to ship, not that today's
# content HAS shipped -- the sync is manual. Measured at the source rather than
# argued: mirror HEAD 698faa3, "sync: mirror from private source", 2026-09-07 -- four
# days older than any of this -- and 0 occurrences of the false sentence in the public
# copy, in 4,866 lines actually fetched and read, which still declares the 2.4.137
# labels. So the false sentence lived only in the private tree and was never
# published. The mirror is stale but INTERNALLY COHERENT (2.4.137 labels beside
# 2.4.137 records), which is why it asserts nothing false; the dangerous state would
# be a PARTIAL sync taking this file without the 222 re-scored rows and the archive
# moves. Both halves of this paragraph are the same lesson twice: an inference about
# an external system is a hypothesis until you fetch the system and count.
#
# The split was deliberate: `_code_version_for` stamps `<sha>-dirty`
# whenever any tracked file is modified, and this tree is shared with other sessions,
# so the re-run was executed from a CLEAN WORKTREE at 2bc6954 and every new record
# carries that bare sha -- the commit whose registry and lock actually produced it.
# THE ORDER ABOVE WAS FOLLOWED IN ITS STRICTER
# FORM, because the August precondition did not hold this time: in August the
# install had ALREADY moved, so "edit first" was right. Here the venv still ran
# 2.4.137, and editing first would have armed the same defect pointing the other
# way - a record stamped 2.4.141 produced by 2.4.137. So: lock bumped, VENV
# REINSTALLED, then a real throwaway record read back to confirm
# resolved_tool_version == docpluck-2.4.141 (not inferred from the pin), THEN
# these four strings, THEN the re-run.
#
# WHY 2.4.141 AT ALL: docpluck <= 2.4.138 rewrote a printed digit `3` into a
# multiplication sign where the surrounding words looked like an interaction term
# (W0i/W0k/W0l), destroying real published tokens. 2.4.141 retires all three.
# Two other downstream consumers had already pinned it; this arena was the last
# one still on 2.4.137.
#
# What 2.4.141 changes here, measured over all 222 current-board records, each set
# re-run at the ceiling ITS published run recorded in provenance.request_timeout_s:
# 48 rows move; every arena mean moves UP or not at all; the movers are +0.0474,
# +0.0306 and -0.0159 in pdf-section-structure-v1's held-out set, +0.0025 in
# pdf-table-extraction-v1's, and 44 fourth-decimal shifts in pdf-text-fidelity-v1's
# (largest +0.0051). Both REVEALED section and table sets: 0 of 22 changed, and the
# table score dicts are byte-identical, which matches docpluck's own claim that PDF
# table output did not move. ACCESSIONS ARE DELIBERATELY NOT NAMED, for the reason
# given above - it holds for this bump exactly as it held for the last one.
#
# The control is what makes those deltas mean anything: the SAME isolated harness
# at 2.4.137 reproduced the published records byte-identically (0 primary diffs,
# 0 full-score diffs) on four sets, so the movement belongs to the library and not
# to the harness. One earlier figure was WITHDRAWN before it reached this file - a
# -0.0109 on the table set that was entirely an artifact of re-running at the
# runner's DEFAULT 120 s ceiling where the published run used 900 s. CORRECTED
# 2026-09-28: a cut IS recorded with `breakdown.error = "TimeoutError: ..."` and the
# run summary counts it as `timeout` (pinned by players/adapters/tests/test_timeout.py);
# the report then scores it 0.0 under the unscoreable policy with the reason kept in
# `unscoreable_reason`. So a mean that includes it still drops, and a diff of
# primaries alone cannot tell it from incapability: read the error/reason field AND
# `provenance.request_timeout_s` off the published run before diffing.
#
# The 2.4.137 records are NOT deleted: runs/<v>/_archive/
# 2026-09-11-docpluck-2.4.137-superseded-by-2.4.141/. pdf-text-fidelity-v1 runs/v1
# remains FROZEN at 2.4.136 and was again left untouched.
