# ---------------------------------------------------------------------------
# claude-opus-5 tier (cycle 12, 2026-09-01). Measured gap: the registry carried
# haiku-4-5 on 22 arenas, opus-4-8 on 17 and sonnet-5 on 17, but the CURRENT
# frontier Opus had ZERO players -- the benchmark's top Claude row was a
# generation behind. `claude --print --model claude-opus-5 --output-format json`
# resolves (the envelope's modelUsage names claude-opus-5), so the tier runs on
# Claude Max via the same `claude` binary, i.e. the same HermeticProfile that
# already contains every other Claude player. These entries MIRROR the
# claude-opus-4-8 block exactly -- same adapter, same prompt, same envelope opt-in
# -- so the only difference between the two rows is the model.
# ---------------------------------------------------------------------------

- player_id: claude-opus-5-siglang
  player_type: ai-model
  player_version: "claude-opus-5"
  instrument: claude-opus-5
  adapter_class: SubprocessCliAdapter
  cli_command: ["claude", "--print", "--model", "claude-opus-5"]
  # Opt in to `--output-format json`: the CLI then returns an envelope
  # carrying token usage and stop_reason around the answer. Without it a
  # Claude player's tokens are unrecoverable. Answer parsing is unchanged;
  # non-envelope stdout falls through to the permissive extractor.
  cli_json_envelope: claude
  prompt_template_path: players/prompts/significance_language.txt
