# --- Nemotron 3 Super 120B via NVIDIA NIM ---------------------------------------
# Promoted 2026-08-12 alongside groq-gpt-oss-120b, which matched it at 1.00/1.00
# on the grim + significance-language smoke. Both were added rather than picking
# the winner, because they are DIFFERENT MODEL FAMILIES and the ensemble analysis
# rewards complementarity over raw strength: two players that fail on the same
# tasks add nothing to a combination, however good each is alone.
# NVIDIA NIM is slower than Groq (~24s/task observed on the 9B), so expect long
# runs; the adapter's 429/5xx backoff covers the throttling.

- player_id: nvidia-nemotron-3-super-120b-xlat
  player_type: ai-model
  player_version: "nvidia/nemotron-3-super-120b-a12b"
  instrument: nvidia-nim-nemotron-3-super-120b-a12b-nothink
  adapter_class: OpenAIChatCompletionsAdapter
  openai_model: "nvidia/nemotron-3-super-120b-a12b"
  # Nemotron 3.x ships with chain-of-thought ON, and the thinking tokens come
  # out of the same budget as the answer. Measured 2026-08-13 on a real p-curve
  # prompt: lightning went from an HTTP 504 to 3.7s, super-120b from 172s to 32s.
  # Without this the route looks unusably slow; the model was never the problem.
  openai_extra_body:
    chat_template_kwargs:
      enable_thinking: false
  openai_base_url_env: NVIDIA_NIM_BASE_URL
  openai_api_key_env: NVIDIA_NIM_API_KEY
  openai_available_models_env: NVIDIA_NIM_MODELS
  prompt_template_path: players/prompts/code_translation_r.txt
