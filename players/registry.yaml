# --- Qwen3.6-35B-A3B, the second local GGUF, with MTP speculative decoding ------
#
# A DIFFERENT INSTRUMENT FROM gpt-oss-20b, not a better one, and the quant is part
# of the identity: this is UD-Q3_K_XL (3-bit) against gpt-oss-20b's Q8_0 (8-bit).
# Comparing them measures architecture AND quantization together. Keeping both on
# the board is the point -- "how much does Q3 cost you on a meta-science task" is a
# question nobody has published an answer to.
#
# SERVE IT WITH THE MTP FLAG, or the score is left on the table:
#     ./scripts/serve-local-gguf.ps1 -Model Qwen3.6-35B-A3B-UD-Q3_K_XL \
#         -SpecType draft-mtp -SpecDraftNMax 2
#
# This GGUF carries a multi-token-prediction head (nextn_predict_layers = 1) that
# llama.cpp IGNORES unless --spec-type draft-mtp is passed -- it even logs "model
# has unused tensor blk.40.nextn.eh_proj.weight -- ignoring" while doing so.
# Measured 2026-08-20 on two real grim prompts: 7.6 tok/s decode without it,
# 10.7-11.7 with it at n-max 2, at 99-100% draft acceptance. gpt-oss-20b has no
# such head, which is why its entries above pass no spec flags.
#
# SAMPLING: temperature 0.0 and a pinned seed, NOT Qwen's published non-thinking
# guidance (temp 0.7, top_p 0.8, top_k 20, presence_penalty 1.5). That guidance is
# for open-ended generation. This player exists to be the board's re-runnable drift
# anchor, and sampling at 0.7 would forfeit exactly that. Only the local players pin
# temperature; the other 165 ai-model entries leave it to the provider, which is
# part of why they drift.
#
# THE REASONING SWITCH IS NOT THE SAME ONE gpt-oss USES, and getting it wrong does
# not look like an error -- it looks like a model that cannot do the task. /props
# reports chat_template_caps.supports_reasoning_effort = false for this template and
# advertises no enable_thinking capability at all, so it was measured against the
# running server on a real grim prompt rather than inferred: with the kwarg the
# answer is ~300 tokens of valid JSON; without it the same prompt was still
# generating past 2,200 tokens. Left on, output runs to the cap, finish_reason is
# `length`, the JSON is truncated, and the arena scores 0.0.

- player_id: local-qwen36-35b-a3b-q3-grim
  player_type: ai-model
  player_version: "local-gguf/Qwen3.6-35B-A3B-UD-Q3_K_XL"
  instrument: local-gguf-qwen3-6-35b-a3b-ud-q3-k-xl-nothink
  adapter_class: LocalGgufAdapter
  endpoint: http://127.0.0.1:8080/v1
  gguf_path: ${SCIENCEARENA_GGUF_DIR}/Qwen3.6-35B-A3B-UD-Q3_K_XL.gguf
  openai_model: Qwen3.6-35B-A3B-UD-Q3_K_XL
  prompt_template_path: players/prompts/grim_consistency.txt
  openai_temperature: 0.0
  openai_extra_body:
    seed: 42
    chat_template_kwargs:
      enable_thinking: false
  confidence_strategy: native
  deterministic: false
  best_effort: true

