# --------------------------------------------------------------------------- #
# Free-tier open-weight models via the opencode gateway (cycle 9, 2026-08-04).
#
# These are the first NON-Claude, non-deterministic players in the benchmark, and
# they matter scientifically: every AI baseline so far is one vendor's family, so
# "an LLM can do this" has really meant "a Claude model can do this". Open-weight
# models at 9-30B are also what a lab without an API budget would actually reach
# for, which is the population this benchmark is supposed to inform.
#
# Auth: OpenRouter, via the credential already stored in opencode
# (`opencode auth list`). NO key is read or committed here — the gateway holds it.
# This is a third-party free tier, NOT the forbidden Anthropic API (CLAUDE.md).
#
# best_effort: true — OpenRouter's free tier is rate-limited (~20 rpm / ~200 per
# day, shared across models) and a throttled task is an INFRA failure, not a wrong
# answer. The flag keeps a partially-covered player from collapsing the common set
# for everyone else, while still ranking it over the tasks it did complete.
#
# NOTE (verified 2026-08-04): OpenCode Zen's own `*-free` models are NOT usable —
# the workspace returns "No payment method" even for free models, so Zen is
# deliberately not wired. OpenRouter `:free` works and is what these entries use.
- player_id: nemotron-nano-9b-grim
  player_type: ai-model
  player_version: "nvidia-nemotron-nano-9b-v2-free"
  adapter_class: SubprocessCliAdapter
  # Wrapped in `timeout`: opencode spawns a detached worker, so a stalled call
  # survives subprocess.run(timeout=) killing only the parent — one task hung 28
  # minutes past --timeout 300 in cycle 9. `-k` guarantees SIGKILL after SIGTERM.
  cli_command: ["timeout", "-k", "20", "240", "opencode", "run", "--model", "openrouter/nvidia/nemotron-nano-9b-v2:free"]
  prompt_template_path: players/prompts/grim_consistency.txt
  confidence_strategy: native
  deterministic: false
  best_effort: true

# UNAVAILABLE 2026-08-04 (cycle 9): openrouter/google/gemma-4-31b-it:free could not
# answer a trivial "reply PONG" prompt within TEN MINUTES, and every one of its 6
# arena tasks came back `timeout exited 124`. That is a queue/availability fact
# about the free tier, not a capability measurement, so the 6 all-timeout records
# were DELETED rather than published — a row of 0.000 would read as "this model
# scored zero" when it never answered at all. The sibling nemotron-nano-9b model
# on the SAME gateway and credential runs fine (~70 s/task), so this is specific
# to the 31B free endpoint. Re-enable and re-measure if its availability improves.
#
# - player_id: gemma-4-31b-grim
#   cli_command: ["timeout","-k","20","240","opencode","run","--model","openrouter/google/gemma-4-31b-it:free"]
#   prompt_template_path: players/prompts/grim_consistency.txt
#   best_effort: true

- player_id: nemotron-nano-9b-siglang
  player_type: ai-model
  player_version: "nvidia-nemotron-nano-9b-v2-free"
  adapter_class: SubprocessCliAdapter
  # Wrapped in `timeout`: opencode spawns a detached worker, so a stalled call
  # survives subprocess.run(timeout=) killing only the parent — one task hung 28
  # minutes past --timeout 300 in cycle 9. `-k` guarantees SIGKILL after SIGTERM.
  cli_command: ["timeout", "-k", "20", "240", "opencode", "run", "--model", "openrouter/nvidia/nemotron-nano-9b-v2:free"]
  prompt_template_path: players/prompts/significance_language.txt
  confidence_strategy: native
  deterministic: false
  best_effort: true

