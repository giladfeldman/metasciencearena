# --- cursor-agent / grok-4.6 (2026-08-19) --------------------------------------
# PUBLISHED WITH TWO STANDING CAVEATS, both machine-enforced rather than prose:
#
#   1. `containment: uncontrolled` on its leaderboard row, because
#      `cursor-agent` CANNOT BE CONTAINED ON WINDOWS:
#   * `--mode ask` + scratch cwd + `--workspace <scratch>` still returned a
#     planted nonce from an absolute path inside this repo (probe 2026-08-19);
#   * its own `--sandbox enabled` refuses to start — "Sandbox requires macOS or
#     Linux".
#      `framework/hermetic.py` marks this profile `flags_insufficient`, so every
#      record it writes classifies `uncontrolled` no matter how it was invoked.
#      Real containment needs a Linux container with the repo absent from the
#      filesystem — see docs/design/containerised-cli-players.md (TODO CC8).
#
#   2. `best_effort: true`, because it ran 8 of the 22 revealed tasks. That flag
#      keeps it OUT of the arena's common-set derivation (otherwise it drags the
#      intersection from 22 down to 8 and the symmetry gate fails every other
#      player), and the page ranks it in the `partial` bucket over the subset it
#      covered rather than head-to-head. The documented meaning of best_effort is
#      "coverage bounded by a token cap rather than by unfairness" — here the cap
#      is the owner's budget, not a provider throttle, which is the same shape and
#      is recorded plainly rather than dressed up as a rate limit.
#
# Effort tier is in the player_id on purpose: `low` and `high` are different
# instruments and must not share a row.
#
# COST, measured before wiring this: a five-word prompt cost 17,991 input tokens
# and real tasks ~45k, because the CLI's own system prompt and tool definitions
# are charged per task and dwarf any arena prompt. Cost is ~45k x n_tasks almost
# regardless of arena, so a cheaper arena means FEWER TASKS, not shorter prompts.
# Completing the remaining 14 tasks would cost ~630k input tokens.
- player_id: cursor-grok-4-6-low-esconvert
  player_type: ai-model
  player_version: "cursor-grok-4.6-low"
  adapter_class: SubprocessCliAdapter
  cli_command: ["cursor-agent", "--print", "--output-format", "json", "--model", "cursor-grok-4.6-low"]
  # cursor-agent's envelope names every field differently from Anthropic's
  # (inputTokens / cacheReadTokens / request_id), so it gets its own unwrap.
  cli_json_envelope: cursor
  prompt_template_path: players/prompts/effect_size_conversion.txt
  confidence_strategy: native
  deterministic: false
  best_effort: true
