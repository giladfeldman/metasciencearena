# Stands in for mistral-large-latest-repro on open-practices-repro-v1 task set v2,
# because the account can no longer reach Mistral Large. It is NOT a continuation
# of that player: different weights, its own player_id, its own instrument. Its v2
# score must never be read against Mistral Large's v1 score.
#
# MEASURED 2026-09-21, one POST each to https://api.mistral.ai/v1/chat/completions
# with this key, within the same minute:
#   mistral-large-latest      403 tier_not_allowed ("not available in your
#                                 subscription tier")
