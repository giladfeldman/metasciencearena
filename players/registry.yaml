# --- Cohere Command via the OpenAI-compatibility endpoint --------------------
# Added 2026-09-05 under the Cohere Labs Catalyst Grant ($1,000, accepted
# 2026-09-01, credits expire ~2027-09-01). These are the exact three tiers the
# application named: "Command A, Command R7B, Command R+, and successors".
#
# WHY OpenAIChatCompletionsAdapter AND NOT A COHERE ADAPTER. Cohere serves an
# OpenAI-compatible endpoint at https://api.cohere.ai/compatibility/v1, so no new
# class is needed. Reuse also keeps these players inside the one code path that
# is already exercised by 100 other entries.
#
# NOT because an unknown class would escape the egress gate — MEASURED
# 2026-09-05, it would not. `is_cloud_player` was fixed on 2026-08-12 precisely
# so that a class matching no prefix and declaring no endpoint returns True. The
# claim "a bespoke adapter would fall outside _CLOUD_ADAPTER_PREFIXES and
# silently defeat the gate" is FALSE for this codebase, and was copied here from
# the Perplexity row in the access ledger, where it is also false and has now
# been corrected. Recording the refutation because the wrong reason was load-
# bearing in three places at once.
#
# The escape hatch that DOES exist is a declared loopback `endpoint`: an entry
# carrying `endpoint: http://localhost/...` is classified LOCAL whatever its
# class is called. No Cohere entry may declare one, and
# test_no_cohere_entry_declares_an_endpoint pins that.
#
# CEILINGS CORRECTED 2026-09-09 from 8000/4000/4000 to the values MEASURED
# against the live API, not read off a docs page. A one-request probe per model
# established each true maximum by bisecting until HTTP 400 TOO_MANY_TOKENS:
#   command-a-03-2025      8192 accepted, 8193 refused
#   command-r-plus-08-2024 4096 accepted, 8000 refused ("must be <= 4096")
#   command-r7b-12-2024    4096 accepted, 8000 refused ("must be <= 4096")
# The previous round numbers sat 192/96/96 tokens BELOW the model's own limit,
# which is the exact shape of "publishing OUR max_tokens as THEIR incapability"
# that _response_meta() in players/adapters/openai_compatible.py warns about.
# NOTE the run record does NOT capture the ceiling that was sent, so this cannot
# be reconstructed from published records -- see TODO (provenance gap).
#
# WHY max_tokens IS SET PER TIER. `_DEFAULT_MAX_TOKENS` is 32000
# (players/adapters/openai_compatible.py), but these models cap their own output
# far lower: Command A at 8k, Command R+ and Command R7B at 4k
# (https://docs.cohere.com/docs/models, read 2026-09-05). Sending 32000 asks for
# more than the model can produce. Each ceiling here is the MODEL's own limit,
# not a budget choice, so a `finish_reason == "length"` on these players is a
# real property of the model and NOT our throttling - the opposite of the Groq
# situation documented above, where 6000 is the provider's free tier.
#
# The three model ids also appear in framework/contract/pricing.json. Two of the
# three prices there are UNVERIFIED (Cohere removed current-Command per-token
# pricing from its public page); settle them from the Billing & Usage dashboard
# after the first full pass before publishing any cost figure.
# ---------------------------------------------------------------------------

