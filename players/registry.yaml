# scimeto 1.74.107 -- A NEW INSTRUMENT, NOT A RELABEL OF THE ENTRY ABOVE.
#
# WHY IT EXISTS. Until 2026-09-21 the three SciMeto adapters overrode neither
# resolved_tool_version() nor version_absence_reason(), so `framework audit
# --versions` printed "[UNCHECKED:undeclared] scimeto-replication-api
# declared=1.71.3" while the service on this machine was demonstrably running a
# 1.74.x build. There was no evidence seam at all: a re-run would have stamped
# 1.71.3 onto the newer build's numbers and nothing in this repository could have
# caught it. players/adapters/_scimeto_common.py now probes the service's own
# /health once per adapter, and the audit compares the two.
#
# MEASURED, and this is the argument for the seam in one observation:
#   2026-09-21 /health -> 1.74.106
#   2026-09-22 /health -> 1.74.107   (same machine, rebuilt overnight)
# A patch release moved under the benchmark in under a day. The declared label
# would have gone on saying 1.71.3 forever.
#
# MEASURED end to end through the LOCAL service before this entry was added,
# with SCIMETO_API_KEY pointed at the local INTERNAL_SERVICE_KEY (the user-scope
# variable had held a hosted production key, which is why every prior attempt
# returned 403 and no re-run was possible):
#   POST 127.0.0.1:3001/api/replications/lookup -> 200
#   data.engine        = scimeto-replication-extractor
#   data.engineVersion = 1.74.107+commit-not-recorded   <- what the WORKER ran
#   records            = 1
# The worker's build identity is finer grain than /health and is attached to the
# response that produced the score, so _capture_provenance prefers it and the
# runner writes it to provenance.resolved_tool_version on every record.
#
# LOCAL ONLY, always: _require_local_scimeto refuses a non-loopback
# SCIMETO_API_URL. The hosted instance is metered and the user pays personally.
- player_id: scimeto-replication-api-1-74-107
  player_type: platform
  maintainer_coi: true   # built and maintained by the arena maintainer; see framework/registry.py
  player_version: "1.74.107"
  instrument: scimeto-1-74-107
  # THE VERSION LADDER, declared rather than parsed. One line on the NEWER entry
  # naming the id it replaces; ordering by the version STRING is not an option,
  # because sorted(["1.74.107", "1.71.3"]) puts 1.71.3 last. Checked by
  # framework/identity.py rule D.
  supersedes: scimeto-replication-api
  adapter_class: ScimetoReplicationApiAdapter
  api_url_env: SCIMETO_API_URL
  api_key_env: SCIMETO_API_KEY
  confidence_strategy: native
  deterministic: true

