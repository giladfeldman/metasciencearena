# --- Groq free-tier output ceiling -----------------------------------------
# Every GROQ_* player carries `openai_extra_body.max_tokens: 6000`. This is NOT a
# judgement about how long an answer should be - it is the provider's tier.
# Groq free tier is 8000 tokens per minute counted as prompt + max_tokens TOGETHER,
# and the reservation is checked BEFORE the model runs. On 2026-08-13 the adapter
# began sending an explicit 32000 ceiling (see `_DEFAULT_MAX_TOKENS`) and Groq
# answered HTTP 413 "Requested 33115, Limit 8000" on 46 of 46 prereg-deviation
# tasks - a whole arena of zeros with the model never consulted.
#
# 6000 is measured, not guessed: the largest prompt across all 17 text arenas is
# 1553 tokens (reference-integrity-v1), so 1553 + 6000 = 7553 clears 8000 with
# room to spare.
#
# The honest cost: p99 of observed completions is ~14.9k tokens, so a long answer
# WILL be cut off here. That is visible as `response_meta.finish_reason == "length"`
# and must be read as Groq's free tier, never as the model's incapability - the
# distinction run_record.schema.json calls the single most important field on the
# record. A player that needs more headroom belongs on a different route.
# ---------------------------------------------------------------------------

# --- Gemini 3.5 Flash via Google AI Studio ---------------------------------------
# Added 2026-08-13 to supplement Groq, whose 200k tokens/day ran out mid-sweep.
# It also closes a real gap: retiring the dead `gemini-2-5-flash-*` CLI family left
# the benchmark with NO Google model at all, so the field was Anthropic + open
# weights only. Smoked on real arena prompts that day: grim 9.4s, significance
# 2.9s, valid JSON on both. gemini-3.6-flash also works but was ~3.5x slower on
# grim for the same output size.
# Credential comes from the Google entry in OpenCode's auth store; the sweep
# script exports it as GEMINI_API_KEY rather than committing anything.
#
# STATUS 2026-08-13, MEASURED, NOT INFERRED: the sweep over these players died on
# HTTP 429 after ~37 tasks, and a bare re-probe hours later still 429s with
#   "Quota exceeded for metric: generativelanguage.googleapis.com/
#    generate_content_free_tier_requests, limit: 20"
# That is 20 REQUESTS PER DAY, not a burst limit, so retrying does not help: one
# 17-arena sweep is ~400 tasks, i.e. 20 days. The two partial runs are archived
# under `_pilot_archive/2026-08-13-gemini-free-tier-429/` rather than left in
# runs/, which would both fail the symmetry gate and publish a 16-task row.
#
# The entries are KEPT, not deleted, because nothing about them is wrong - the
# smoke timings above are real and the route works. It is the free tier that is
# too small. A Google model on a usable quota should come from `agy`
# (Antigravity, serves gemini-3.6/3.5-flash free) or from OpenRouter, not from
# raising this one's retry count.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# openai/gpt-oss-120b served by OPENROUTER (added 2026-08-13).
#
# Why a second identity for a model we already run on Groq: Groq's free tier is
# 200k tokens/DAY, which exhausted mid-sweep and left 7 arenas damaged. OpenRouter
# meters the same weights on an INDEPENDENT quota, so the coverage gap can be
# closed today instead of one arena per day.
#
# It is a separate player_id, never a re-tag of the Groq one, because the serving
# stack is part of what a score measures - and this is not hypothetical here.
# OpenRouter is a ROUTER: a 2026-08-13 probe for `openai/gpt-oss-120b` came back
# served by Amazon Bedrock, and the same id is also fanned out over CoreWeave,
# DeepInfra, Novita and Google at different quantizations. So:
#   * `provider.order` pins ONE backend and `allow_fallbacks: false` refuses a
#     silent substitution - an unavailable backend must fail loudly, not quietly
#     score a different artifact under this player's name;
#   * the adapter records `response_meta.served_by`, so the pin is EVIDENCED per
#     record rather than merely asserted here.
#
# The pin is Cerebras, chosen by timing every backend on a REAL p-curve arena
# prompt (2026-08-13) rather than a toy round-trip - the toy probe that misjudged
# NVIDIA earlier the same day is why. Same prompt, same ~1300-1900 output tokens:
#
#     Cerebras    2.0s   fp16   $0.35/$0.75 per 1M
#     Novita     17.6s   fp4    $0.05/$0.25
#     CoreWeave  39.3s   fp4    $0.03/$0.17
#     DeepInfra 151.2s   fp4    $0.05/$0.25
#     Google      HTTP 429 (upstream quota);  Fireworks  HTTP 404 (no endpoint)
#
# Cerebras costs ~10x more per token and is still the right pin: it is the only
# fp16 endpoint. The cheap backends serve a 4-BIT quantization, so a score from
# them is a score for a compressed variant published under the name of the full
# model - the misattribution this file's model allowlists already exist to stop.
#
# COVERAGE 2026-08-13: p-curve-v1 and power-reporting-v1 only, both COMPLETE
# (12/12, 21/21, zero errors). The sweep then died on prereg-deviation-v1 with
# HTTP 402 on 45 of 46 tasks - archived under
# `_pilot_archive/2026-08-13-openrouter-402-credit-exhausted/`.
#
# The 402 is worth reading carefully, because the key's own /key endpoint says
# `limit: 1, limit_remaining: 0.94` and looks healthy. The ACCOUNT is what binds:
# /credits reports `total_credits: 0`. OpenRouter reserves credit for the full
# `max_tokens` up front, so the error is "you requested up to 40960 tokens, but
# can only afford 39463" - the model was never asked anything. Two consequences,
# both now fixed rather than worked around:
#   * the adapter had been sending NO `max_tokens` at all, letting each provider
#     apply its own ceiling (see `_DEFAULT_MAX_TOKENS`);
#   * a key-level budget is not an account-level budget. Check /credits, not /key.
#
# Two complete arenas is not a broken player - symmetry is judged WITHIN an arena
# and both are full task sets - so these stay. The rest of gpt-oss-120b's coverage
# comes from Groq, whose daily quota resets.
# ---------------------------------------------------------------------------

