# --- gpt-oss-20b across the remaining 13 locally-feasible arenas ----------------
#
# Generated by scripts/gen_local_player_entries.py --model gptoss20b, so all 13 differ
# from each other in exactly two fields (the id suffix and the prompt template) and
# are otherwise byte-identical. Hand-copying 13 near-identical blocks is how one stale
# `gguf_path` reaches an overnight run and is found the next morning.
#
# WHY gpt-oss-20b RATHER THAN Qwen3.6, which was piloted the same day: measured head
# to head on the same three arenas, same machine, same scorer --
#
#     arena                      gpt-oss-20b-Q8   Qwen3.6-A3B-Q3
#     grim-consistency-v1            0.6035           0.3328
#     significance-language-v1       0.7846           0.3930
#     power-reporting-v1             0.7796           0.7822
#
# gpt-oss wins two decisively and ties the third. It is also 11.28 GB against 16.04,
# which matters for an unattended overnight run: the Qwen pilot drove free RAM to
# 333 MB, and its prefill is 2.5x slower (~30 vs ~79 tok/s) on prompts that reach
# 1,494 tokens in these arenas.
#
# READ THE GAP CAREFULLY - it is CONFOUNDED and not a clean statement about weights or
# quantization. The two models got different REASONING treatments, because their
# vendors expose different switches and neither is a dial: gpt-oss ran at
# `reasoning_effort: low`, which still reasons and reasons ADAPTIVELY (213-2363
# completion tokens across the 16 grim tasks), while Qwen ran at
# `enable_thinking: false`, which is fully off (296-320 tokens, a flat band). The score
# gap tracks that token gap almost exactly, and the one arena where the token counts
# were closest is the one where they tied. Qwen's own budgeted-thinking middle ground
# could NOT be used: `--reasoning-budget` is server-only, `/props` does not report it,
# and a scored run whose key parameter cannot reach the run record is the kind of
# unverifiable label this player class exists to refuse.
#
# WHY `best_effort: true` ON A PLAYER THAT COVERS EVERYTHING. It reads like an admission
# of partial coverage and it is not one: these runs cover the full public task set
# (20/20, 22/22, ...). The flag is a SAFETY VALVE for an unattended multi-hour local run.
# A best-effort player is excluded from the arena's common-set DERIVATION, so if a run is
# cut short by a sleeping laptop or an OOM it degrades to the `partial` bucket instead of
# collapsing the head-to-head task set for every hosted player in that arena. At FULL
# coverage it costs nothing: leaderboard-app/lib/compute.ts ranks a best-effort player
# that covers the whole common set exactly like any other
# (`isRanked = bestEffort.has(pid) ? coversCommon : coRanked.has(pid)`), and that
# behaviour is PINNED by leaderboard-app/scripts/tests/fairness-gates.test.mjs rather
# than merely read off the source.
- player_id: local-gpt-oss-20b-q8-refint
  player_type: ai-model
  player_version: "local-gguf/gpt-oss-20b-Q8_0"
  instrument: local-gguf-gpt-oss-20b-q8-rlow
