# transcript to stderr but ONLY writes the assistant's final answer to
# the file passed via `-o <file>`, so we use that path via the adapter's
# output_message_flag hook. `--skip-git-repo-check` keeps it from
# refusing to run if the cwd isn't a git repo (we are, but this is
# defensive).
