# --- Nemotron 3 Super 120B via NVIDIA NIM ---------------------------------------
# Promoted 2026-08-12 alongside groq-gpt-oss-120b, which matched it at 1.00/1.00
# on the grim + significance-language smoke. Both were added rather than picking
# the winner, because they are DIFFERENT MODEL FAMILIES and the ensemble analysis
# rewards complementarity over raw strength: two players that fail on the same
# tasks add nothing to a combination, however good each is alone.
# NVIDIA NIM is slower than Groq (~24s/task observed on the 9B), so expect long
# runs; the adapter's 429/5xx backoff covers the throttling.

