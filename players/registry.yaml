  instrument: metafor-5-0-1
  adapter_class: RCliAdapter
  r_script: players/adapters/metafor_pubbias.R
  confidence_strategy: implicit-1.0
  deterministic: true

# publication-bias-v1 task set v2 reference tool. Runs the SAME script that builds
# the v2 gold (arenas/publication-bias-v1/tools/pubbias_v2_stats.R), so on the nine
# deterministic statistics it must score 1.0 -- a DETERMINISM check of the gold
# pipeline, not an independent validation (that is tools/crosscheck_gold_v2.py). RoBMA is MCMC: this player uses RoBMA seed 1 while
# the gold uses 20260930, so its RoBMA credit is a live measurement of sampler
# noise against the tolerance band. `deterministic: true` means "one trial": a
# re-run with the same seed reproduces it.
# player_version names both packages; only metafor is drift-checked automatically
# (r_adapter_package reads the first library() call).
