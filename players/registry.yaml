# (task set v2, 2026-09-28).
#
# A chat API cannot read a PDF, so every `-via-pdftotext` player is the model
# PLUS poppler's pdftotext run on this machine (`document_to_text: pdftotext`):
# it scores what the model makes of that text, not the model reading the page.
# The front end is in the player_id on purpose. Cloud players run the PUBLIC
