# RETIRED 2026-08-12: the whole `gemini-2-5-flash-*` family. Google discontinued
# the Gemini CLI's individual/free sign-in on 2026-06-18; the binary is still on
# PATH but every call now returns
#   IneligibleTierError: This client is no longer supported for Gemini Code
#   Assist for individuals. ... migrate to the Antigravity suite
# so these players cannot be re-run, only replayed from frozen records.
#
# That is why they had to go rather than simply sit idle: a player that can never
# run again PERMANENTLY BLOCKS TASK-SET GROWTH. `gemini-2-5-flash-sections` held
# 6 records on pdf-section-structure-v1, and any task added to that arena's public
# split would have left it asymmetric forever, pinning the ranked cohort at 6 and
# keeping the "Insufficient sample" banner up for good.
#
# Successor route is Antigravity (`agy`), already registered as
# `antigravity-gemini-3-6-flash-low-*`. It serves Gemini 3.6 Flash, a DIFFERENT
# model, so it gets its own player ids rather than inheriting these — a score
# published under `gemini-2-5-flash` must mean Gemini 2.5 Flash.
#
# Records archived (not deleted) under
# arenas/pdf-section-structure-v1/runs/v1/_archive/2026-08-12-gemini-cli-retired/.
# Ids kept here as tombstones so they are never silently reused.
#   - player_id: gemini-2-5-flash
#     player_type: ai-model
#     player_version: "gemini-2.5-flash"
#     adapter_class: SubprocessCliAdapter
#     cli_command: ["gemini", "-p", "", "-m", "gemini-2.5-flash"]
#     prompt_template_path: players/prompts/replication_lookup_model.txt
#     confidence_strategy: native
#     deterministic: false
#     # RETIRED 2026-08-10 — kept so historical records stay attributable, but this
#     # player CANNOT be re-run: the `gemini` CLI now returns IneligibleTierError
#     # ("Code Assist for individuals" discontinued) and Google's replacement route
#     # (Antigravity, `agy models`) does not serve Gemini 2.5 at all. Its successor
#     # on this arena is the entry directly below. Do not re-point this id at a 3.x
#     # model — that would publish a 3.x score under a 2.5 label.
#
#   # Successor to gemini-2-5-flash on replication-target-lookup-v1, via Google's
#   # Antigravity CLI (the supported individual route since the Gemini CLI retired).
#   # ⚠️ DEPLOY COUPLING: this entry needs `players/adapters/antigravity_cli.py` and
#   # the `agy_*` kwargs in framework/player_adapter.py. Commit them TOGETHER or the
#   # adapter class will not resolve and `framework audit` / `next build` will fail.


- player_id: antigravity-gemini-3-6-flash-low-replication
  player_type: ai-model
  player_version: "antigravity/gemini-3.6-flash-low"
  adapter_class: AntigravityCliAdapter
  agy_model: "gemini-3.6-flash-low"
  agy_print_timeout: "300s"
  # The arena's real output contract (arenas/replication-target-lookup-v1/schemas/
  # output.schema.json) verbatim, MINUS its `$schema` key. Two measured findings,
  # 2026-08-10 — both cost a round of all-failed records:
  #   1. A lightweight stand-in is worse than none. Requiring only `matches` steered
  #      the model into OMITTING direction/input_doi/player_strategy_notes, and every
  #      record failed output_schema_violation.
  #   2. `agy` rejects two constructs outright (status ERROR in ~0.4 s, bisected):
  #      a `$schema` key — so `agy_json_schema_path` cannot point at the .json file
  #      directly — and any `enum` containing the EMPTY STRING, which the arena's
  #      `outcome` enum has. Dropping "" leaves a strict subset of the arena's allowed
  #      values, so output stays valid. agy DOES accept enum, additionalProperties:false,
  #      union types and min/max; with those two fixes the model emits proper nulls
  #      and abstentions.
  agy_json_schema: '{"type":"object","additionalProperties":false,"required":["direction","input_doi","matches","player_strategy_notes"],"properties":{"direction":{"type":"string","enum":["targets","replications"]},"input_doi":{"type":"string"},"matches":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["replication_doi","original_doi","abstained"],"properties":{"replication_doi":{"type":["string","null"]},"original_doi":{"type":["string","null"]},"outcome":{"type":"string","enum":["failed","successful","succeeded","mixed","unknown"]},"confidence":{"type":"number","minimum":0,"maximum":1},"evidence":{"type":"string"},"provenance":{"type":"array","items":{"type":"string"}},"abstained":{"type":"boolean"}}}},"player_strategy_notes":{"type":"string"}}}'
  prompt_template_path: players/prompts/replication_lookup_model.txt
  confidence_strategy: native
  deterministic: false
  best_effort: true

