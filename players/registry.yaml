#
# The adapter POSTed to a synchronous `POST /api/citations/extract` that SciMeto
# has never served. That path was an ASSUMPTION, written into the adapter's own
# docstring in 2026-05 and never checked against the service. Measured 2026-09-21
# and 2026-09-22 against the source of the running local build (v1.74.107): the
# service mounts no citations router at all, and the ~40 routers it does mount
# have no synchronous reference-extraction route among them. A live probe cannot
# settle this on its own -- every request 403s in a pre-routing auth layer, so the
# status code is identical for "route absent" and "route present, unauthenticated".
# The mount list is the evidence; the 403 is not.
#
# It is retired rather than rewired because the rewire is blocked by a standing
# user directive, not by effort. SciMeto has no synchronous seam for this
# capability: reference parsing runs only inside its asynchronous, per-document
# pipeline, and EVERY intake path into that pipeline -- its public
# `POST /api/v1/analyze` included -- persists the submitted document to a REMOTE
# object store on a production cloud account before any processing happens. So a
# run nominally aimed at 127.0.0.1 would still ship every held-out arena PDF off
# this machine. Cross-testing is local-only (user directive) and the PDF task
# inputs are held out, so that route is closed. Contrast `scimeto-replication-api`,
# which scores 20 published records precisely because its capability DOES have a
# standalone, document-free seam.
