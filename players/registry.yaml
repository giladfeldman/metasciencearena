# --- Docling players (added 2026-08-19) ------------------------------------
#
# Docling (docling.ai, IBM Research -> LF AI & Data, MIT). NOT an LLM player and
# NOT a rule-based parser: the default pipeline is a chain of small LOCAL
# discriminative models -- a DocLayNet-trained RT-DETRv2 layout detector and
# TableFormer, a vision transformer for table structure. Table text is matched
# back onto the PDF's own text cells rather than re-transcribed, so the tool
# cannot invent a value that is not on the page. Classified `tool`, local for
# the egress gate, and therefore allowed on the held-out corpus.
#
# `player_version` folds the PIPELINE into the identity, not just the package
# version: Docling swapped its default layout model between releases (+23.5%
# mAP), so `docling-2.120.3` alone does not name the instrument. Changing the
# table mode or the layout engine must mint a NEW player rather than silently
# extend an old one's history. `framework audit --versions` requires the
# detected version to be a substring, so "2.120.3" stays literal.
#
# `deterministic: true` was MEASURED, not assumed. Shipped as false first, which
# makes the runner take 3 trials, which turned the first tournament into the
# determinism probe: 12/12 synthetic tasks AND 8/8 real held-out PMC papers
# reproduced identically across all three trials (evidence retained outside the
# repo; see players/INSTALL_LOG.md). No published determinism study of Docling
# exists, so this is a small new result.
#
# It matters beyond bookkeeping: `framework/report.py::_summary` computes the CI
# over RAW RECORDS with no collapsing by task_id, so leaving this false would
# publish n_scored = 3x the task count and a confidence interval sqrt(3) too
# NARROW -- three identical trials presented as three independent observations.
# Every other player on the board runs one trial; this one must too.
- player_id: docling-tables
  player_type: tool
  player_version: "docling-2.120.3-tableformer-accurate-noocr"
  adapter_class: DoclingTablesAdapter
  tool_native: true
  confidence_strategy: implicit-1.0
  deterministic: true

# The OPT-IN VlmPipeline: granite-docling-258M, a LOCAL GENERATIVE
# vision-language model that replaces the whole specialist chain. Still zero
# egress, but hallucination-capable in a way the standard pipeline is not --
# which is exactly why it is a separate row rather than a config flag.
- player_id: docling-vlm-tables
  player_type: tool
  player_version: "docling-2.120.3-vlm-granite-docling-258m"
  adapter_class: DoclingTablesAdapter
  docling_vlm: true
  tool_native: true
  confidence_strategy: implicit-1.0
  deterministic: true

