# code-translation-r-v1 — SPSS/Stata syntax -> R.
#
# The non-LLM field here is genuinely tiny (surveyed 2026-08-03): only three
# real syntax translators exist, none has ever been on CRAN, and one has been
# dormant since 2021. That asymmetry IS the finding this arena reports — the
# honest claim is "there is almost no tooling", not "LLMs beat the tools".
#
# All three are R packages, so their output is captured once and committed as
# version-pinned fixtures under the arena's fixtures/tool_outputs/ (user
