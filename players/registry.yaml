# --- prereg-deviation-v1 players -----------------------------------------
# regcheck (the headline tool) brings its own LLM/embedding API dependency. It is
# an LLM-backed comparator, so we run it under THREE providers as distinct players
# (model breadth) — one RegcheckShimAdapter class, `regcheck_client` pins each:
#   * regcheck-groq     : regcheck's native Groq path (GROQ_API_KEY, env-only).
#   * regcheck-deepseek : regcheck's native DeepSeek path (DEEPSEEK_API_KEY, env-only;
#                         OpenAI-compatible endpoint at https://api.deepseek.com).
#   * regcheck-openai   : OpenAI provider routed through the local codex-backed shim
#                         (players/regcheck_shim/openai_shim.py — the owner's ChatGPT
#                         subscription, NO OpenAI API key/cost; see CLAUDE.md).
# In every mode EMBEDDINGS go to the local shim (neither Groq nor DeepSeek expose
# one), so no real OpenAI key is ever needed. Provider keys are read from the live
# environment only — never committed, never on argv, never in the sanitized
# provenance command. The heavy regcheck clone + venv are NOT committed;
# RegcheckShimAdapter locates them via REGCHECK_DIR / REGCHECK_PYTHON and fails
# loudly with a runbook pointer when unset. deterministic:false (LLM-backed).
# confidence_strategy:native — derived from regcheck's own yes/no/missing judgement
# (players/regcheck_shim/regcheck_to_runrecords.py). See run_regcheck.md.
- player_id: regcheck-groq
  player_type: tool
  player_version: "regcheck-bdb961d-groq-llama3.1-8b"
  adapter_class: RegcheckShimAdapter
  regcheck_client: groq
  # llama-3.1-8b-instant, NOT llama-3.3-70b-versatile: the 70b model exhausts the
  # Groq free-tier daily token cap (TPD 100k) after ~4-7 tasks (verified
  # 2026-06-08 AND 2026-07-02). The 8b model has a separate, larger quota and is
  # the proven config for reaching most of the 46-task split. 429-lost tasks are
  # excluded from scoring (infra throttle, not a wrong answer).
  regcheck_model: "llama-3.1-8b-instant"
  confidence_strategy: native
  deterministic: false
  # best_effort CLEARED 2026-08-04 (cycle 8): this player now has FULL 46/46
  # coverage (0 errored), so the flag no longer describes reality. It is not a
  # free "be lenient" marker — it EXCLUDES a player from the common-set
  # derivation, so leaving it on a full-coverage player both understates that
  # player (reported `partial` when it isn't) and needlessly shrinks the
  # head-to-head basis. The Groq throttle is real but it is a per-MINUTE TPM
  # 6000 limit, which a paced retry loop clears — not a hard coverage ceiling.
  # Re-add it if a future run genuinely cannot finish the split.

- player_id: regcheck-deepseek
  player_type: tool
  player_version: "regcheck-bdb961d-deepseek-chat"
  adapter_class: RegcheckShimAdapter
  regcheck_client: deepseek
  regcheck_model: "deepseek-chat"
  confidence_strategy: native
  deterministic: false
  # best_effort CLEARED 2026-08-04 (cycle 8): paid DeepSeek, full 46/46 coverage.
  # It was always the symmetric anchor; the flag was defensive, not descriptive.

- player_id: regcheck-openai
  player_type: tool
  player_version: "regcheck-bdb961d-openai-via-codex-shim"
  adapter_class: RegcheckShimAdapter
  regcheck_client: openai
  confidence_strategy: native
  deterministic: false
  best_effort: true

