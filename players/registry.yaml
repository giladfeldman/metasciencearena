#   magistral-medium-latest   429 rate_limited
#   ministral-3b-latest       200
#   ministral-8b-latest       200
#   ministral-14b-2512        200   <- this entry
# The 200s are the positive control. The key and the endpoint work, so the 429s
# are a real per-model allowance of ZERO rather than a transient throttle or bad
# auth — the header says the LIMIT is 0, not that the remainder is.
#
# DATED id, not `-latest`: `latest` floats and the instrument is supposed to name
# the weights. GET /v1/models/ministral-14b-latest returned name=ministral-14b-2512
# on 2026-09-21, so the dated id is what this calls.
#
# THROTTLING: La Plateforme returns HTTP 429 on back-to-back requests, so this
# carries best_effort and runs must be paced. Fill gaps with
# `framework retry-failed`, never by leaving errored records — they are excluded
# from the mean and would otherwise read as coverage the player does not have.
