# Allowed values for leaf.input_artifact.
# Each entry is what a player receives for a task in this challenge.
# Add new entries with care — they become a coupling point for player adapters.
- id: pdf_manuscript
  description: A scientific paper as PDF (born-digital or scanned).
- id: docx_manuscript
  description: A scientific paper as a Microsoft Word .docx file.
- id: pdf_or_docx_manuscript
  description: Either pdf_manuscript or docx_manuscript; arena chooses per task.
- id: plain_text_section
  description: Plain text excerpt of one section of a manuscript (e.g. results).
- id: structured_prereg
  description: A preregistration document in a known platform schema (OSF, AsPredicted, …).
- id: paper_metadata_record
  description: Bibliographic metadata only (title, authors, abstract, DOI, venue).
- id: doi_or_identifier
  description: A bare DOI, arXiv id, PubMed id, or canonical URL.
- id: dataset_with_codebook
  description: A tabular dataset plus its codebook/data dictionary.
- id: peer_review_text
  description: One or more peer-review comment blocks.
- id: citation_context_window
  description: A citing paper's text window around a citation marker.
- id: replication_doi_query
  description: A DOI plus a direction (targets | replications) requesting bidirectional replication↔original lookup.
- id: reference_list
  description: A paper's reference list (structured reference records, optionally with DOIs) plus its in-text citation markers.
- id: repo_file_listing
  description: A listing of files in a referenced data/code repository (name, type, size, and optional contents) — e.g. an OSF/GitHub/Zenodo snapshot.
- id: statistical_syntax_script
  description: An analysis script in a non-R statistical language (SPSS .sps syntax, Stata .do), together with the codebook of the dataset it runs against, to be translated into equivalent R.
- id: effect_size_conversion_request
  description: "One effect size to convert: {value, from, to, context: {n1, n2}} across the closed set {d, r, OR, eta2, f}."
- id: summary_statistics_table
  description: "Reported descriptive statistics, one row per statistic: {stat_id, label, mean, sd, percent, n, n_items, scale_min, scale_max, decimals} (fields per arena)."
- id: meta_analytic_dataset
  description: "A set of k studies, each an effect-size estimate and its standard error: {k, studies: [{yi, sei}]}."
- id: significant_findings_set
  description: "A set of independent significant findings, each a test statistic: {findings: [{type, value, df1, df2, n}]}."
- id: significant_test_statistics_set
  description: "A set of significant results as z-scores: {study_set_id, z_scores, n_studies}."
- id: scientific_figure_set
  description: "One or more rendered scientific figures (raster images, base64) with panel layout and captions, optionally grouped into several synthetic papers; for image-integrity screening."
- id: registry_record_and_trial_report
  description: "A clinical-trial registry record (registration and start dates, outcomes, target N, arms, follow-up) together with the trial report it registers."
- id: rct_report_package
  description: "A randomised-trial report as sections (eligibility, allocation, participant flow, baseline and results tables), optionally with its registry record, a second publication of the same study and notice metadata."
- id: correlation_matrix
  description: "A reported correlation matrix {labels, values, decimals, n}, off-diagonals rounded to the stated precision."
- id: manuscript_and_code_repository
  description: "A paper's methods and results text plus the file listing and contents of its analysis-code repository."
