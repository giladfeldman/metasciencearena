# Allowed values for leaf.output_to_judge.
# Each entry describes the shape the player must return for tasks in this challenge.
# Players that handle the same output_to_judge across multiple arenas can share adapters.
- id: list_of_effect_size_records
  description: List of {effect_size, ci_low, ci_high, test_statistic, claim_text}.
- id: extracted_text_blocks
  description: Ordered list of {block_type, text, page} extracted from a document.
- id: retrieved_artifact
  description: A file (PDF/HTML/XML/TXT) plus metadata about which path/source returned it.
- id: list_of_deviation_records
  description: List of {deviation_type, prereg_text, paper_text, severity}.
- id: structured_field_map
  description: A dict mapping declared field names to extracted values.
- id: classification_label
  description: A single label from a declared label set.
- id: ranked_list
  description: An ordered list with optional scores per item.
- id: list_of_doi_pair_records
  description: List of {replication_doi, original_doi, outcome, confidence, evidence, provenance, abstained}.
- id: pdf_clean_text_with_pages
  description: "Clean linear text plus per-page strings plus a footnote array: {full_text, pages, footnotes}."
- id: pdf_section_records
  description: Ordered IMRaD-labeled section records with heading text and char span.
- id: pdf_table_records
  description: "Table records with caption, page, header rows, and cell grid (r, c, rowspan, colspan, text, is_header)."
- id: pdf_reference_records
  description: Structured reference records (authors, year, title, venue, doi, pmid) parsed from a bibliography.
- id: citation_reference_linkage_report
  description: "In-text citation records {marker_text, char_start, char_end, reference_id} plus a consistency report {orphan_markers, uncited_reference_ids, duplicate_reference_groups}."
- id: list_of_reporting_completeness_records
  description: "Per reported test: {span, has_effect_size, p_precision_issue, p_zero, missing_ci, missing_df, is_nonsignificant} completeness/precision flags."
- id: list_of_flagged_spans
  description: "List of {span, category, confidence} flags for language patterns (e.g. marginal-significance, spin, causal-overclaim)."
- id: list_of_reference_integrity_records
  description: "Per reference: {reference_id, issue_kind, flagged, confidence} integrity flags (retracted, metadata mismatch, dangling/uncited, has-replication)."
- id: list_of_open_practice_records
  description: "Per repository file or claim: {target, issue_kind, flagged, confidence} reproducibility flags (absolute path, uncomment, missing-file, broken-link)."
- id: translated_r_script
  description: "An R script that reproduces the source script's analysis: {r_code, confidence}. Judged by EXECUTING it against the same dataset and comparing the statistics it emits to gold — not by textual similarity to a reference translation."
- id: converted_effect_size
  description: "The converted value: {converted, confidence, formula, note}."
- id: list_of_sprite_plausibility_records
  description: "Per statistic: {stat_id, issue_kind, flagged, confidence} flags for mean/SD combinations no integer sample can produce (SPRITE-style)."
- id: list_of_grim_consistency_records
  description: "Per statistic: {stat_id, issue_kind, flagged, confidence} flags for means or percentages that are GRIM/GRIMMER-inconsistent."
- id: publication_bias_verdict
  description: "{bias_detected, confidence, egger_p, n_missing_trimfill} for a meta-analytic dataset."
- id: publication_bias_statistics
  description: "Per method, the statistics a publication-bias analysis reports for a meta-analytic dataset: {egger {p}, begg {tau, p}, trimfill {k0, estimate}, pet {estimate}, peese {estimate}, three_psm {estimate, lrt_p}, robma {bf_bias, mu}}. No verdict."
- id: p_curve_evidential_verdict
  description: "{evidential_value, right_skew_p, flatness_p, confidence} from a p-curve analysis."
- id: evidential_value_verdict
  description: "{has_evidential_value, expected_discovery_rate, confidence} from a z-curve analysis."
- id: list_of_image_integrity_records
  description: "Per finding: {finding_id, kind, bik_category, target {figure, panel, region}, source {figure, panel, region} | null, transform, confidence}, plus a per-figure verdict {figure, has_issue, confidence}. Regions are bounding boxes or run-length-encoded masks."
- id: matrix_consistency_verdict
  description: "{verdict: consistent | inconsistent | undecided, confidence} for a rounded correlation matrix."
- id: trustworthiness_check_records
  description: "Per INSPECT-SR check: {check_id, answer: yes | no | unclear | not_applicable, evidence, confidence}, plus {domain_judgments, overall_judgment} each no / some / serious concerns."
- id: list_of_code_paper_mismatch_records
  description: "Per mismatch: {analysis_id, kind: reported_not_implemented | implemented_differently | implemented_not_reported, paper_span, code_location, confidence}."
- id: review_flaw_report
  description: "A written review plus its itemised flaws {flaw_id, category, location, claim, confidence}, matched against the injected flaw list."
