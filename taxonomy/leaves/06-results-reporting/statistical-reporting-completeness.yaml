id: statistical-reporting-completeness
name: Statistical reporting completeness & p-value precision
lifecycle_stage: 06-results-reporting
order: 20
description: |
  Given a results section, flag reporting-completeness problems WITHOUT
  recomputing test statistics (that is statcheck's job, already benchmarked in
  stats-extraction-v1). Detect: tests reported without an effect size, p-values
  reported imprecisely (p<.05 when an exact value is knowable), impossible p=.000,
  missing confidence intervals, missing degrees of freedom, and non-significant
  p-values framed as support. Mirrors metacheck's stat_effect_size, stat_p_exact,
  all_p_values, stat_p_nonsig modules. Synthetic ground truth by injecting each
  completeness defect.
input_artifact: plain_text_section
output_to_judge: list_of_reporting_completeness_records
existing_solutions:
  - {id: metacheck, type: tool, owner: third-party}
  - {id: claude-baseline, type: ai-model, owner: anthropic}
  - {id: human-coder-trained, type: human-baseline, owner: in-house}
ground_truth_feasibility: high
arena_status: live
scope_tier: A
notes: |
  Distinct from stats-extraction-v1 (which extracts/validates the numbers). This
  leaf is about completeness/precision of reporting. Arena: reporting-completeness-v1.
