id: summary-stat-distribution-plausibility
name: Summary-stat distribution plausibility (SPRITE)
lifecycle_stage: 06-results-reporting
order: 40
description: |
  Given a reported mean, SD, N, and an integer response scale [min, max], decide
  whether any sample of N integers in that range can actually produce the reported
  mean and SD. Flags impossible descriptives: a mean outside the scale bounds, or
  an SD whose variance exceeds the theoretical maximum for bounded data
  ((max-mean)*(mean-min)). Mirrors the SPRITE technique (rsprite2 R package), which
  reconstructs plausible sample distributions behind reported statistics. Synthetic
  ground truth: consistent stats come from real integer samples; impossible ones
  are injected with rigorous sufficient conditions.
input_artifact: summary_statistics_table
output_to_judge: list_of_sprite_plausibility_records
existing_solutions:
  - {id: rsprite2, type: tool, owner: third-party}
  - {id: claude-baseline, type: ai-model, owner: anthropic}
  - {id: human-coder-trained, type: human-baseline, owner: in-house}
ground_truth_feasibility: high
arena_status: live
scope_tier: A
notes: |
  Complements summary-stat-granularity-consistency (GRIM/GRIMMER): GRIM checks
  granularity, SPRITE checks distributional achievability of mean+SD together.
  Arena: sprite-plausibility-v1.
