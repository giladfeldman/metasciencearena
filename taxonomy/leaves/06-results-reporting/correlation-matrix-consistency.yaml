id: correlation-matrix-consistency
name: Rounded correlation-matrix consistency (positive semidefiniteness)
lifecycle_stage: 06-results-reporting
order: 90
description: |
  Given a reported correlation matrix rounded to a stated number of decimals,
  decide whether any genuine (positive semidefinite) correlation matrix could
  round to it: consistent, inconsistent, or undecided at this precision. One
  well-defined case of INSPECT-SR check 4.10, other contradictions implied by
  the data (doi:10.1136/bmj-2026-100611). Synthetic matrices; gold is decidable
  and is verified by an independent solver, never by the player under test.
input_artifact: correlation_matrix
output_to_judge: matrix_consistency_verdict
existing_solutions:
  - {id: port, type: tool, owner: third-party}
  - {id: claude-baseline, type: ai-model, owner: anthropic}
ground_truth_feasibility: high
arena_status: design
scope_tier: A
notes: |
  Arena: correlation-matrix-consistency-v1 (design only). port
  (github.com/ianhussey/port) is a deterministic player.
