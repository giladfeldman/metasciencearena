id: baseline-allocation-plausibility
name: Allocation and baseline-data plausibility in randomised trials
lifecycle_stage: 06-results-reporting
order: 80
description: |
  Given the allocation method, group sizes and baseline table of a synthetic
  randomised trial, flag group sizes that are impossible or improbable under the
  stated randomisation, baseline means that are implausibly similar or dissimilar
  across arms (Carlisle-type), and standard deviations outside what the scale
  bounds allow. Mirrors INSPECT-SR checks 4.2 and 4.3
  (doi:10.1136/bmj-2026-100611). Some signals are probabilistic, so scoring
  reports detection at a stated false-alarm rate rather than per-item
  right/wrong on a stochastic flag.
input_artifact: rct_report_package
output_to_judge: list_of_flagged_spans
existing_solutions:
  - {id: strait, type: tool, owner: third-party}
  - {id: claude-baseline, type: ai-model, owner: anthropic}
ground_truth_feasibility: medium
arena_status: design
scope_tier: B
notes: |
  Arena: baseline-allocation-plausibility-v1 (design only). strait
  (github.com/ianhussey/strait) covers the bounds part only.
