id: participant-flow-consistency
name: Participant-flow and cross-table consistency in trial reports
lifecycle_stage: 06-results-reporting
order: 70
description: |
  Given the eligibility criteria, participant-flow description, baseline table
  and results tables of a synthetic randomised trial report, flag numbers that
  do not add up (randomised vs allocated vs analysed), unexplained changes in
  participant numbers, disagreements between text, tables and figures, baseline
  values outside the eligibility criteria, and implausible loss to follow-up.
  Mirrors INSPECT-SR checks 4.1, 4.4, 4.5 and 4.6 (doi:10.1136/bmj-2026-100611).
  Synthetic inputs; every injected inconsistency is arithmetic, so gold is exact.
input_artifact: rct_report_package
output_to_judge: list_of_flagged_spans
existing_solutions:
  - {id: claude-baseline, type: ai-model, owner: anthropic}
  - {id: human-coder-trained, type: human-baseline, owner: in-house}
ground_truth_feasibility: high
arena_status: design
scope_tier: B
notes: |
  Arena: participant-flow-consistency-v1 (design only). No packaged
  deterministic checker found; LLM entries are labelled as such.
