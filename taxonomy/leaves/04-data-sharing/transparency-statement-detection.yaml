id: transparency-statement-detection
name: Transparency-statement detection (COI, funding, open practices)
lifecycle_stage: 04-data-sharing
order: 10
description: |
  Detect and extract transparency statements from a manuscript: conflict-of-interest
  and funding statements (present/absent + text), and open-practices statements for
  data / code / materials / preregistration availability (including the
  "available on request" non-statement vs a real repository link). Mirrors
  metacheck's coi_check(+oi), funding_check(+oi), open_practices, all_urls modules.
  Synthetic ground truth by composing manuscripts with/without each statement and
  injecting placeholder/broken URLs and on-request hedges.
input_artifact: plain_text_section
output_to_judge: structured_field_map
existing_solutions:
  - {id: metacheck, type: tool, owner: third-party}
  - {id: oddpub, type: tool, owner: third-party}
  - {id: rtransparent, type: tool, owner: third-party}
  - {id: claude-baseline, type: ai-model, owner: anthropic}
  - {id: human-coder-trained, type: human-baseline, owner: in-house}
ground_truth_feasibility: high
arena_status: live
scope_tier: A
notes: |
  Arena: transparency-statements-v1. oddpub / rtransparent are natural additional
  tool players here.
