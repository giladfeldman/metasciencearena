id: pdf-citation-matching
name: PDF in-text citation matching (Layer 6)
lifecycle_stage: 09-submission-artifacts
order: 14
description: |
  Given a scientific PDF, return every in-text citation marker (text
  span plus the reference entry it points to) and a consistency report:
  orphan in-text citations (no matching reference), uncited references,
  and duplicate references. Gold derived from JATS <xref ref-type="bibr">
  linkage on the same PMC corpus seeded by pdf-text-fidelity-v1.

  Sibling of pdf-text-fidelity (Layer 1), pdf-section-structure
  (Layer 3), and pdf-reference-parsing (Layer 5) under the same
  lifecycle stage. Where pdf-reference-parsing parses the bibliography,
  this layer links in-text callouts to it — the structural task
  reference-string parsers cannot do.

  Scoring composites in-text marker detection F1, linkage accuracy, and
  consistency-report F1.
input_artifact: pdf_or_docx_manuscript
output_to_judge: citation_reference_linkage_report
existing_solutions:
  - {id: grobid,               type: tool,     owner: third-party}
  - {id: scimeto,              type: platform, owner: gilad}
  - {id: claude-haiku-4-5-pdf, type: ai-model, owner: anthropic}
ground_truth_feasibility: high
# Corrected 2026-08-09: was `live`, but arenas/<id>/ has NO task_sets/ dir, so
# build-data.mjs cannot build a bundle and demotes it to "design" in index.json
# every single build. The taxonomy is the source of truth other tools read, and it
# was the one claiming something the repo cannot back — the same class as the
# index.json-advertising-dead-arenas trap. Flip back to `live` in the SAME commit
# that adds a task set and a ground-truth source.
arena_status: design
scope_tier: A
notes: |
  Isolates in-text linkage — SciMeto/CitationGuard's core differentiator.
  AnyStyle and CERMINE do not enter this arena: they parse reference
  strings but do not link in-text callouts.
