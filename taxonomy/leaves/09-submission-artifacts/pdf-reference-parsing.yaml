id: pdf-reference-parsing
name: PDF reference list parsing (Layer 5)
lifecycle_stage: 09-submission-artifacts
order: 12
description: |
  Given a scientific PDF, return structured reference records (authors
  with surname/given_names, year, title, venue, volume, issue, pages, doi,
  pmid, raw_text). Gold is the paper's JATS <ref-list> (held-out real PMC
  papers) or the structured source of a synthetic bibliography (public).

  Sibling of pdf-text-fidelity (Layer 1), pdf-section-structure (Layer 3)
  and pdf-citation-matching (Layer 6) under the same lifecycle stage.

  Scoring (task set v2): 0.5 * entry F1 + 0.5 * field accuracy. Entries
  are paired by CONTENT -- equal DOI, near-equal title, or the overlap of
  everything printed in the entry -- one-to-one, best pairs first
  (framework/scoring/references.py). Field accuracy is taken over the
  fields the gold states, so a field a reference does not print is never
  graded.
input_artifact: pdf_or_docx_manuscript
output_to_judge: pdf_reference_records
existing_solutions:
  - {id: grobid,               type: tool,     owner: third-party}
  - {id: anystyle,             type: tool,     owner: third-party}
  - {id: cermine,              type: tool,     owner: third-party}
  - {id: claude-haiku-4-5-pdf, type: ai-model, owner: anthropic}
ground_truth_feasibility: high
# Live since 2026-09-28 (task set v2): arenas/<id>/task_sets/v2/ carries the
# manifest and the committed public gold, and held-out gold is served from the
# eval-only registry. Until then this said `design`, because the arena had no
# task_sets/ dir and build-data.mjs demoted it every build (corrected 2026-08-09).
arena_status: live
scope_tier: A
notes: |
  Docpluck does not enter this arena -- its scope is text fidelity, not
  bibliographic parsing. GROBID is the strongest deterministic baseline;
  AnyStyle and CERMINE run in local containers (players/docker/).
  Chat-API models play "-via-pdftotext": the model plus a local
  pdftotext front end, named as such.
