id: paper-mill-signal-detection
name: Paper-mill signal detection across a batch of manuscripts
lifecycle_stage: 09-submission-artifacts
order: 20
description: |
  Given a batch of synthetic manuscripts, flag paper-mill indicators: template
  text reused across papers, tortured phrases, method or instrument descriptions
  that do not fit the study, implausible author and affiliation patterns, and
  citation stacking. Indicators are not proof: scoring reports detection at a
  stated false-alarm rate, and no real paper is ever labelled.
input_artifact: pdf_or_docx_manuscript
output_to_judge: list_of_flagged_spans
existing_solutions:
  - {id: torturedcheck, type: tool, owner: gilad}
  - {id: papermill-alarm, type: platform, owner: third-party}
  - {id: claude-baseline, type: ai-model, owner: anthropic}
ground_truth_feasibility: medium
arena_status: design
scope_tier: B
notes: |
  Arena: paper-mill-signals-v1 (design only). Extends text-integrity-duplication;
  build that first. torturedcheck is a maintainer tool (conflict of interest).
