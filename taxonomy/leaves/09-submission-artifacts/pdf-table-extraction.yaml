id: pdf-table-extraction
name: PDF table extraction (Layer 4a)
lifecycle_stage: 09-submission-artifacts
order: 12
description: |
  Given a scientific PDF, return one record per table-wrap with caption,
  page, header rows, and a cell grid (r, c, rowspan, colspan, text,
  is_header). Gold derived from JATS <table-wrap> on the same PMC corpus
  seeded by pdf-text-fidelity-v1 (one corpus → three arenas).

  Sibling of pdf-text-fidelity (Layer 1) and pdf-section-structure
  (Layer 3) under the same lifecycle stage. Arena activated once
  docpluck's structured-table extractor (extract_pdf_structured) shipped
  cell-level fidelity in v2.4.x (2026-05).
input_artifact: pdf_or_docx_manuscript
output_to_judge: pdf_table_records
existing_solutions:
  - {id: docpluck-table-extractor, type: platform, owner: gilad}
  - {id: grobid,                   type: tool,     owner: third-party}
  - {id: claude-haiku-4-5-pdf,     type: ai-model, owner: anthropic}
  - {id: gemini-2-5-flash-pdf,     type: ai-model, owner: google}
ground_truth_feasibility: high
arena_status: live
scope_tier: A
notes: |
  Score: 0.4·detection-F1 + 0.4·cell-token-F1 + 0.2·structure agreement.
  Caption recall is a breakdown metric, not part of the composite.
  Difficulty axes: source_kind, n_tables, header_complexity.
