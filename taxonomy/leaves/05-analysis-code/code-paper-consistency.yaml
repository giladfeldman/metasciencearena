id: code-paper-consistency
name: Reported-analysis vs analysis-code consistency
lifecycle_stage: 05-analysis-code
order: 30
description: |
  Given a synthetic paper's methods and results and a synthetic R analysis
  repository, flag analyses reported but not implemented, implemented
  differently (covariates, exclusions, model family, sidedness) or implemented
  but not reported. Each injected mismatch is verified by executing the code, so
  gold does not rest on reading alone.
input_artifact: manuscript_and_code_repository
output_to_judge: list_of_code_paper_mismatch_records
existing_solutions:
  - {id: codebot, type: tool, owner: third-party}
  - {id: claude-baseline, type: ai-model, owner: anthropic}
ground_truth_feasibility: high
arena_status: design
scope_tier: A
notes: |
  Arena: code-paper-consistency-v1 (design only). No deterministic player found.
