id: reference-integrity-checks
name: Reference integrity checks (retraction, accuracy, consistency)
lifecycle_stage: 08-citations
order: 10
description: |
  Given a paper's reference list and in-text citations, flag integrity problems:
  citing a retracted paper, bibliographic metadata that mismatches the canonical
  record (author/year/title/DOI), dangling references (cited-but-absent or
  listed-but-uncited), citing an original without its known replication, and
  commonly-miscited papers. Mirrors metacheck's ref_accuracy, ref_retraction,
  ref_pubpeer, ref_replication, ref_consistency, ref_miscitation modules.
  Synthetic ground truth by injecting each integrity defect (the arena knows which
  references it made retracted/mismatched, so no live database is required).
input_artifact: reference_list
output_to_judge: list_of_reference_integrity_records
existing_solutions:
  - {id: metacheck, type: tool, owner: third-party}
  - {id: claude-baseline, type: ai-model, owner: anthropic}
  - {id: human-coder-trained, type: human-baseline, owner: in-house}
ground_truth_feasibility: high
arena_status: live
scope_tier: A
notes: |
  Arena: reference-integrity-v1. Distinct from pdf-reference-parsing-v1 /
  pdf-citation-matching-v1 (which PARSE and LINK); this leaf judges INTEGRITY.
