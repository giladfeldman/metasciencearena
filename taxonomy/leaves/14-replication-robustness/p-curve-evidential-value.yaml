id: p-curve-evidential-value
name: P-curve evidential value of a findings set
lifecycle_stage: 14-replication-robustness
order: 25
description: |
  Given a SET of independent statistically-significant findings (p < .05), each
  supplied as a test statistic, decide whether the set has EVIDENTIAL VALUE by the
  p-curve method (Simonsohn, Nelson & Simons, 2014). p-curve tests the RIGHT-SKEW of
  the significant p-values: real, well-powered effects produce p-values that cluster
  near 0 (right-skewed curve = evidential value); selection over null effects produces
  a FLAT curve (false positives); intense p-hacking produces a LEFT-skewed curve. The
  verdict is the full-curve right-skew test (Stouffer's combination of the pp-value
  z-scores, right_skew_p < .05). Synthetic ground truth: each set is generated from a
  known regime (real effect with decent power vs. selected nulls vs. p-hacked just under
  .05), so the evidential-value label is the controlled generating process, not a tool
  output. Sets are built far from the right-skew decision boundary so the deterministic
  reference cross-validates the gold.
input_artifact: significant_findings_set
output_to_judge: p_curve_evidential_verdict
existing_solutions:
  - {id: p-curve, type: tool, owner: third-party}
  - {id: claude-baseline, type: ai-model, owner: anthropic}
  - {id: human-coder-trained, type: human-baseline, owner: in-house}
ground_truth_feasibility: high
arena_status: live
scope_tier: A
notes: |
  Set-level (not per-study) evidential-value classification via the p-curve right-skew
  test. DISTINCT from zcurve-evidential-value (which fits a z-curve EM mixture over
  significant z-values to estimate expected discovery/replication rate): p-curve tests
  the right-skew of the significant p-values, a different statistic with a different
  null and verdict rule. Reference player is a faithful pure-R implementation of the
  Simonsohn et al. (2014) p-curve (dmetar unavailable for R 4.4; puniform implements
  p-uniform*, a sibling method). Arena: p-curve-v1.
