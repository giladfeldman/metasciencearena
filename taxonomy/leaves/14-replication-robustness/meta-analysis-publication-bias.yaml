id: meta-analysis-publication-bias
name: Meta-analysis small-study / publication bias
lifecycle_stage: 14-replication-robustness
order: 30
description: |
  Given a META-ANALYTIC dataset (a SET of studies, each with an effect-size estimate
  yi and its standard error sei), compute the statistics of the standard
  small-study / publication-bias methods: Egger's regression test, Begg and
  Mazumdar's rank correlation, trim-and-fill, PET-PEESE, the three-parameter
  selection model and robust Bayesian meta-analysis (RoBMA). Scored on whether each
  statistic matches what the named method produces (gold from metafor and RoBMA
  in R), NOT on a biased/unbiased verdict: how to turn these statistics into a
  verdict is an unresolved methodological question (owner decision 2026-09-17).
  This is task set v2. The superseded v1 asked for the verdict instead, on datasets
  constructed far from the Egger decision boundary.
input_artifact: meta_analytic_dataset
output_to_judge: publication_bias_statistics
existing_solutions:
  - {id: metafor, type: tool, owner: third-party}
  - {id: claude-baseline, type: ai-model, owner: anthropic}
  - {id: human-coder-trained, type: human-baseline, owner: in-house}
ground_truth_feasibility: high
arena_status: live
scope_tier: A
notes: |
  Set-level (not per-study) publication-bias statistics over a meta-analytic dataset. Distinct
  from zcurve-evidential-value (which classifies a set of SIGNIFICANT z-scores for
  evidential value) — this leaf works on effect/SE pairs with
  the classic publication-bias diagnostics. Arena: publication-bias-v1.
