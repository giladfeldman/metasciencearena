id: prereg-vs-paper-deviation-detection
name: Preregistration vs. paper deviation detection
lifecycle_stage: 02-preregistration
order: 10
description: |
  Given a preregistration document and the eventual published paper,
  identify all deviations: undisclosed analyses, changed hypotheses,
  altered exclusion criteria, switched DVs, etc. Synthetic ground truth
  by generating prereg/paper pairs from templates with known deviations
  injected.
input_artifact: structured_prereg
output_to_judge: list_of_deviation_records
existing_solutions:
  - {id: regcheck, type: tool, owner: third-party}
  - {id: human-coder-trained, type: human-baseline, owner: in-house}
  - {id: gpt-frontier-zero-shot, type: ai-model, owner: anthropic-or-openai}
ground_truth_feasibility: high
arena_status: live
scope_tier: A
notes: |
  Live arena: arenas/prereg-deviation-v1/. Synthetic (prereg, paper) pairs with
  injected deviations across regcheck's comparison dimensions (sample size,
  in/exclusion, hypotheses/HARKing, outcome switching, statistical models,
  randomisation, …). Dual-benchmark (revealed + private). regcheck is the headline
  tool player; LLM + trained-human baselines round out the field.
