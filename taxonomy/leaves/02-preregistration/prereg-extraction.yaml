id: prereg-extraction
name: Preregistration link detection & field extraction
lifecycle_stage: 02-preregistration
order: 30
description: |
  Given a paper, find its preregistration link (OSF registration, AsPredicted, …)
  and extract the registration into structured fields (hypotheses, design, sample
  size, analysis plan, …) per the source schema. Mirrors metacheck's prereg_check
  module. Synthetic ground truth by composing papers that embed OSF/AsPredicted
  links of known structure, plus traps: no preregistration, prereg stored as
  unstructured plain text, and wrong field mappings.
input_artifact: plain_text_section
output_to_judge: structured_field_map
existing_solutions:
  - {id: metacheck, type: tool, owner: third-party}
  - {id: claude-baseline, type: ai-model, owner: anthropic}
  - {id: human-coder-trained, type: human-baseline, owner: in-house}
ground_truth_feasibility: high
arena_status: live
scope_tier: A
notes: |
  Arena: prereg-extraction-v1. Distinct from prereg-vs-paper-deviation-detection
  (which COMPARES); this leaf EXTRACTS the registration.
