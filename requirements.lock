# Extraction changes: tables 2.4.18 -> 2.4.21, normalization 1.9.70 -> 1.9.71.
# ALSO BUMP the operator's dependency map (arena -> docpluck `pin:`) in the same pass.
# 2.4.154 (2026-10-24, tag v2.4.154 peeled = 15f4d69f): no new runtime dependency (pyproject
# changes only its version); extraction changes: normalization 1.9.71 -> 1.9.75, sections 1.2.6,
# tables -> 2.4.25. Boards re-run in the same pass.
