# Catalog of synthetic studies for prereg-extraction-v1.
#
# Each study supplies the four canonical preregistration FIELDS the player must
# extract (hypotheses, design, sample_size, analysis_plan) plus a registration id
# fragment used to build OSF / AsPredicted links and a view_only_token used to
# build an anonymized OSF view-only URL. The generator renders these fields into
# one of several surface forms:
#   - osf            : a clean, structured OSF-style registration (clean control)
#   - aspredicted    : a clean, structured AsPredicted-style registration (clean control)
#   - doi_clean      : the canonical OSF registration DOI link (clean control;
#                       confusable look-alike for the viewonly abuse)
#   - embargo_lifted : embargo lifted before publication, fields public (clean
#                       control; confusable look-alike for the embargoed abuse)
#   - live_cited     : a live registration cited correctly (clean control;
#                       confusable look-alike for the withdrawn abuse)
#   - plaintext      : an unstructured plain-text registration (prereg_plaintext mistake)
#   - wrong_schema   : AsPredicted field labels under an OSF link, or vice versa
#                       (wrong_platform_schema mistake)
#   - viewonly       : registration linked only via an anonymized view-only OSF
#                       URL instead of the canonical link (viewonly_instead_of_doi)
#   - embargoed      : registration referenced but still embargoed at publication;
#                       fields unrecoverable (embargoed_at_publication mistake)
#   - withdrawn      : a withdrawn (tombstone) registration still cited as
#                       pre-registered; no usable plan (withdrawn_still_cited)
#   - none           : no registration is embedded at all (no_prereg mistake)
#
# planned phrases (intro_options / measure_options) only vary the surrounding
# narrative wording so revealed vs private content differs; the gold FIELD VALUES
# come straight from the four canonical fields below.

