arena_id: citation-claim-fidelity-v1
title: "Citation Claim Fidelity"
taxonomy_leaf_id: citation-claim-fidelity
version: 0.1.0
owner: gilad
license: MIT
input_artifact: citation_context_window
output_to_judge: list_of_claim_fidelity_verdicts
# Every player must run in the pinned runner image (CLAUDE.md directive). A
# player that cannot is refused before its first task.
runner: container-required
min_ranked_n: 30
difficulty_axes:
  - {id: group_size, min: 1, max: 6, description: "How many citing sentences of the same source the task presents together (one abstract, k sentences, one verdict each). Realistic groups: each sentence is a different place that cites the source; never two variants of one sentence in a task."}
  - {id: n_not_consistent, min: 0, max: 6, description: "How many of the task's sentences the abstract does not support (perturbed, wrong paper, or a real contradiction)."}
task_set_versions:
  # n_tasks = the REVEALED (public) count, the convention for arenas with benchmark_splits
  # (framework/tests/test_task_count_matches_the_task_set.py). Private split: v1 419, v2 589.
  - {version: v1, status: superseded, generator_fingerprint: "sha256:720ba82e5454b46556829175f8390d50f0d676dd15212f157d78db950aafb757", n_tasks: 5, released_on: "2026-10-14"}
  # v2 (owner decision 2026-10-15): v1 had 11 C1 items, below the recall bar's
  # pre-registered min_n of 15. v2 = all 419 v1 private tasks unchanged + 170 new
  # tasks from seeds whose citing sentence and abstract state a common number
  # (C1 edits only, plus those seeds' original sentences), built and blind-
  # validated exactly like v1 (tools/build_tasks.py --build v2). C1: 57 items.
  # The bars are unchanged.
  - {version: v2, generator_fingerprint: "sha256:dbe3611f4e9330db7166243d6e6ee2337bd11b96fa1b8a4014430ad85017ad06", status: superseded, n_tasks: 5, released_on: "2026-10-15", rationale: "Shown: free-tier models whose run on the 589 private tasks completed. gpt-oss-120b (Groq) and Gemini Flash-Lite ran out of free quota before finishing and are not ranked, so all ranked models here are served by NVIDIA. The score is not the arena's pre-registered pass-bar test, which uses pooled per-type rates."}
  # v3 (citeclaim Stage D, 2026-10-18): every v2 task unchanged (tier "synthetic", same
  # private seed, so the same task ids) + the real-data tiers: one task per usable pair of
  # two public human-labelled datasets, gold = the datasets' own labels mapped by a fixed
  # table (tools/build_real_tier.py; docs/design/2026-10-citeclaim-stage-d-real-data.md).
  # Private split: 1156 tasks (589 synthetic, 228 rd-zhang2024, 339 rd-scifact-dev).
  - {version: v3, generator_fingerprint: "sha256:b82de176297a09f1ebde9d415ea9dff1f0d46bc9b99553398ea2d9424851602f", status: superseded, n_tasks: 5, released_on: "2026-10-18", comparable_with_previous: false, rationale: "Adds the real-data tiers (human-labelled public datasets) to v2's synthetic tasks; a whole-set score mixes populations, so scores are reported per tier and are not comparable with v2's."}
  # v4 (citeclaim Stage E, 2026-10-18) = every v3 task byte-for-byte (same private seed, so
  # the same task ids) + tier rd-mmc-pilot: real citing sentences from the MetaMisCitations
  # corpus, one task per citeclaim call (one source, up to 6 sentences), FRONTIER labels
  # (three-seat consensus or a blind Opus xhigh decider; tools/build_mmc_tier.py;
  # docs/design/2026-10-citeclaim-stage-e-mmc-pilot.md). v3 tiers score identically on v4.
  - {version: v4, generator_fingerprint: "sha256:d0b8aafcfca4261dec2f3b91fc83482282f0a98dcb4224f119e80ad3bc3330b3", status: current, n_tasks: 5, released_on: "2026-10-18", comparable_with_previous: true, rationale: "Adds tier rd-mmc-pilot; every v3 task and its id are unchanged, so v3 per-tier scores stay comparable with v4 (they remain on the v3 board). Scored per data tier, never pooled."}
benchmark_splits:
  # Revealed: hand-written FICTIONAL examples (catalogs/revealed_examples.yaml);
  # no real article text is ever in this repository. Private: real open-access
  # citing sentences and abstracts, read from article custody by sha256
  # (ground_truth/citeclaim-2026-10/build_vN/tasks_vN.jsonl).
  revealed: {seed: 0, published: true}
  private:
    seed_source: secret_file        # task_sets/<version>/.private_seed (gitignored); salts held-out task ids
    real_holdout_dir: custody:ground_truth/citeclaim-2026-10/build_v4   # v1: build_v1, v2: build_v2, v3: build_v3
  parity:
    # The revealed split is a handful of fictional examples; the private split is
    # the real benchmark. They are not built to be parity twins.
    # independent_holdout: the private split is a real third-party corpus under
    # real_holdout_dir, not the same generator under a secret seed, so cell parity
    # cannot hold; the check steps aside LOUDLY (reported as NOT ENFORCED).
    independent_holdout: true
    match_axes: [group_size]
    match_categories: false
    count_tolerance: 1.0
# Conflict of interest: Claude Opus and Sonnet labelled the real sentences and
# generated/validated the perturbations, so Anthropic-family players are not
# the arena's target and never count toward the pass bars. citeclaim is a
# maintainer tool (registry: maintainer_coi).
# ---------------------------------------------------------------------------
# PASS BARS, pre-registered 2026-10-14 BEFORE any player was scored (owner
# decision: bars met -> continue to Stages D/E/F; a bar missed -> stop and ask
# the owner). Evaluated by tools/check_bars.py on the private (real) split.
# Stage C passes when at least ONE free-tier, non-COI model instrument meets
# every applicable bar. Recall bars apply to a type only with >= min_n items;
# a type below that is reported, not evaluated (declared here, in advance).
# [Note 2026-10-15: the two sentences above are the FIRST version. The revision
# below (2026-10-14, before any scoring) made a type below min_n FAIL, and that
# is what bars.py does. The evaluator is tools/analyze_run.py, which calls bars.py.]
pass_bars:
  # Revised 2026-10-14 after the tier-3 consult (Sonnet + Sol), still before any
  # model was scored (git history: first version in 69e703d). Changes: a bar whose
  # precondition is unmet FAILS instead of being skipped (an all-'silent' player
  # passed when contradiction types fell below min_n); coverage per gold class; a
  # 'contradicts' on an abstract-silent sentence is a false suggestion too; the
  # upper bound is max(Wilson, abstract-level cluster bootstrap); bars must hold on
  # every repeat; grouping is required.
  population: "private split; free-tier model instruments outside the Anthropic family (the gold's labelers) and not maintainer tools; guarded verdicts (an evidence quote not found in the abstract counts as no verdict, as in the citeclaim library)"
  repeats: "every bar must hold on each of the 2 repeat runs of the same instrument"
  coverage_min: 0.90
  clean_false_alarm:
    definition: "items with gold 'consistent' judged 'contradicts'"
    min_n: 30
    max_rate: 0.10
    max_upper95: 0.15
  silent_false_alarm:
    definition: "items with gold 'silent' (the abstract cannot settle the claim) judged 'contradicts'"
    min_n: 30
    max_rate: 0.15
    max_upper95: 0.22
  recall:
    definition: "A4/A2/C1/C3: judged 'contradicts'; A1/B3: judged 'contradicts' or 'silent'. A type with fewer than min_n items FAILS (precondition not met)."
    min_n: 15
    min: {A4: 0.70, C1: 0.70, C3: 0.60, A2: 0.50, A1: 0.50, B3: 0.80}
  grouping:
    definition: "paired per-item accuracy, all-sentences-in-one-call minus one-sentence-per-call, over items in tasks with >= 3 sentences, same model and prompt; missing result FAILS"
    min_mean_difference: -0.05
    min_ci95_lower: -0.10
  calibration: "not applicable in v1: the output has no confidence field"
  self_test: "an all-'contradicts', an all-'consistent' and an all-'silent' player must each FAIL these bars; the gold itself must pass"
  reported_not_barred: "precision of 'contradicts' at assumed real miscitation prevalences of 5%, 10% and 20%, from each instrument's clean false-alarm rate and pooled A4/A2/C1/C3 recall"
  # Added 2026-10-15 with task set v2, before any v2 score was read (tier-3 consult,
  # docs/consults/2026-10-15-citeclaim-v2-c1/): v2's added C1 items are a selected,
  # easier population (a number the abstract states verbatim, changed) and v2 adds
  # clean items, so the unchanged bars do not measure exactly what they measured on
  # v1. Reported beside every v2 verdict, never barred: accuracy, clean false-alarm
  # rate and C1 recall separately for the v1-core tasks and the v2 top-up tasks.
  reported_by_cohort: "accuracy, clean false-alarm rate and C1 recall for v1-core vs v2-c1-topup tasks (analyze_run.py by_cohort)"
  # -------------------------------------------------------------------------
  # REAL-DATA TIERS (task set v3), pre-registered 2026-10-18 BEFORE any player was
  # scored on them (citeclaim Stage D; owner decision 2026-10-14: bars met -> report
  # and continue; a bar missed -> stop and ask the owner). Evaluated per tier by
  # tools/analyze_run.py --tier <id> (bars.evaluate_tier) on that tier's items only;
  # the two repeats are joined by tools/combine_repeats.py. The synthetic tier of v3
  # keeps the bars above, unchanged.
  # First version in commit 820af38; revised the same day after the tier-3 consult
  # (Sonnet + Sol, docs/consults/2026-10-18-citeclaim-stage-d-real-data/), still before
  # any score: the Zhang false-suggestion bar tightened to the Stage C clean bar; the
  # pooled discrimination bar demoted to reported (a policy that only tells the label
  # sources apart passed it); SciFact made a non-gating calibration check (the plan's
  # "calibration only") with a false-reassurance check added; independent-abstract
  # preconditions; required_bars; one instrument per run file.
  # What the Zhang tier can and cannot show: its labels were judged against the FULL
  # text, so at abstract level they are constraints (a substantiated sentence must not
  # be called 'contradicts'; an unsubstantiated one must not be called 'consistent'),
  # not three-way gold. It bounds false suggestions on real valid citations and checks
  # gross detection of unsubstantiated (mostly irrelevant-reference) citations; it does
  # NOT measure recognition of support (an all-'silent' player passes it) or recall of
  # subtle real miscitations (21 citation-study items). Those claims are never made.
  real_data_tiers:
    rd-zhang2024:
      dataset: "Zhang & Abernethy 2024, arXiv 2411.06101 (data ODC-By 1.0): real citing statements and the cited reference's abstract; labels judged against the reference's full text; no inter-rater agreement reported"
      mapping: "Fully substantiated -> not_contradicts (consistent or silent agree with the label); Unsubstantiated -> not_consistent (contradicts or silent agree); Partially substantiated (14) and pairs without an abstract (8) excluded"
      population: "free-tier model instruments outside the maintainer tools; guarded verdicts as above; 228 items, one per task"
      gating: true
      repeats: "every gating bar must hold on each of the 2 repeat runs of the same instrument"
      coverage_min: 0.90
      required_bars: [coverage, substantiated_false_alarm_rate, substantiated_false_alarm_upper95, unsubstantiated_detection]
      false_suggestion:
        substantiated_false_alarm: {gold: not_contradicts, verdict: contradicts, min_n: 30, min_clusters: 30, max_rate: 0.10, max_upper95: 0.15}
      recall:
        unsubstantiated_detection: {gold: not_consistent, accept: [contradicts, silent], min_n: 30, min: 0.70}
      grouping: "not applicable: one sentence per task (the dataset has no groups of different sentences citing one source)"
      reported_not_barred: "constraint agreement (the scorer's accuracy; NOT verdict accuracy: an all-'silent' player scores 1.0); 'contradicts'-only rate on Unsubstantiated; discrimination ('consistent' share on Fully minus on Unsubstantiated, lower 95% = min(Newcombe, joint cluster bootstrap)) pooled AND within the citation-study source; every number per label source (all 121 Fully come from the citation studies; 79 of 107 Unsubstantiated from PubPeer); per-explanation verdicts; precision of 'contradicts' at 5/10/20% prevalence from the false-suggestion rate; abstracts per class; served model"
    rd-scifact-dev:
      dataset: "SciFact dev set (claims CC BY 4.0, abstracts ODC-By 1.0): expert-written atomic claims from citation sentences x the abstracts their source sentence cited; labels judged against the abstract (label agreement Cohen's kappa 0.75 on 232 re-annotated pairs, SciFact paper). Rewritten claims and constructed negations, not real miscitations"
      mapping: "SUPPORT -> consistent; CONTRADICT -> contradicts; a cited abstract the annotators found no evidence in (NOT ENOUGH INFO) -> silent"
      population: "as rd-zhang2024; 339 items, one per task"
      gating: false
      gating_note: "calibration only (plan, Stage D): evaluated and reported beside every verdict; a miss is reported to the owner prominently but does not by itself stop the stage"
      repeats: "evaluated on each of the 2 repeat runs"
      coverage_min: 0.90
      required_bars: [coverage, clean_false_alarm_rate, clean_false_alarm_upper95, silent_false_alarm_rate, silent_false_alarm_upper95, nei_false_reassurance_rate, nei_false_reassurance_upper95, contradiction_recall, support_recall]
      false_suggestion:
        clean_false_alarm: {gold: consistent, verdict: contradicts, min_n: 30, min_clusters: 30, max_rate: 0.10, max_upper95: 0.15}
        silent_false_alarm: {gold: silent, verdict: contradicts, min_n: 30, min_clusters: 30, max_rate: 0.15, max_upper95: 0.22}
        nei_false_reassurance: {gold: silent, verdict: consistent, min_n: 30, min_clusters: 30, max_rate: 0.30, max_upper95: 0.40}
      recall:
        contradiction_recall: {gold: contradicts, accept: [contradicts], min_n: 30, min: 0.60}
        support_recall: {gold: consistent, accept: [consistent], min_n: 30, min: 0.60}
      grouping: "not applicable: one claim per task"
      reported_not_barred: "accuracy (three-way, the labels are abstract-level); 3x3 confusion of gold vs verdict; abstracts per class; served model. SciFact is public since 2020 and widely used for training, so contamination cannot be excluded"
    # Pre-registered 2026-10-18 before any gold existed (docs/design/2026-10-citeclaim-stage-e-mmc-pilot.md,
    # commit b0a6f3a); amendments 1/1a changed who labels, not the bars.
    rd-mmc-pilot:
      dataset: "MetaMisCitations pilot (citeclaim Stage E): real citing sentences from 10 psychology, economics and finance papers x the cited source's abstract, grouped per source as the citeclaim library groups them. Labels are FRONTIER labels, not human labels: three-seat consensus (Opus 5.5, Sonnet 5.5, GPT-6.1 Sol) or, where they disagree, a blind Opus 5.5 decider at --effort xhigh"
      mapping: "label used as is (consistent / contradicts / silent); 'undecidable' items dropped; meta.source = frontier_consensus | adjudicated"
      population: "free-tier model instruments outside the maintainer tools; guarded verdicts; Anthropic-family players are COI (two of three label seats and the decider)"
      gating: false
      gating_note: "frontier labels, rare real contradictions: evaluated and reported beside every verdict; a miss is reported to the owner prominently but does not by itself stop the stage. Scores are agreement with frontier labels, never accuracy against human truth"
      repeats: "evaluated on each of the 2 repeat runs"
      coverage_min: 0.90
      required_bars: [coverage, clean_false_alarm_rate, clean_false_alarm_upper95, silent_false_alarm_rate, silent_false_alarm_upper95, contradiction_recall]
      false_suggestion:
        clean_false_alarm: {gold: consistent, verdict: contradicts, min_n: 30, min_clusters: 30, max_rate: 0.10, max_upper95: 0.15}
        silent_false_alarm: {gold: silent, verdict: contradicts, min_n: 30, min_clusters: 30, max_rate: 0.15, max_upper95: 0.22}
      recall:
        contradiction_recall: {gold: contradicts, accept: [contradicts], min_n: 15, min: 0.60}
      grouping: "not barred: tasks are the library's real groups (sizes 1-6); per-group-size results reported"
      reported_not_barred: "three-way agreement with frontier labels overall, per label source (consensus / adjudicated), per discipline and single- vs multi-marker sentence; 3x3 confusion; served model; the decider's agreement with the consensus on the 10% unanimity audit"
error_categories:
  - id: false_alarm_on_clean
    description: A sentence the abstract supports was judged 'contradicts' (a wrong suggestion a user would see).
    severity: major
  - id: missed_contradiction
    description: A sentence the abstract contradicts was judged 'consistent' or 'silent'.
    severity: major
  - id: missed_not_consistent
    description: A sentence the abstract does not support (misrepresented finding, wrong paper) was judged 'consistent'.
    severity: major
  - id: overclaimed_support
    description: A sentence the abstract is silent on was judged 'consistent'.
    severity: minor
  - id: wrong_silent
    description: A sentence the abstract supports was judged 'silent' (coverage loss, not a false suggestion).
    severity: minor
  - id: no_verdict
    description: No usable verdict for a sentence (missing item, verdict outside the scheme, or an evidence quote not found in the abstract).
    severity: major
display_columns:
  - {id: accuracy, source: score.primary, label: Accuracy, description: "Per task, the share of its citing sentences given the right evidence-scoped verdict (consistent, contradicts or silent; for a misrepresented finding or a wrong paper either non-consistent verdict counts); the column is the mean of that share over tasks, so a 1-sentence task weighs as much as a 6-sentence one. A verdict whose evidence quote is not in the abstract counts as no verdict.", direction: higher, format: f3, primary: true}
# Board display per DATA TIER (owner 2026-10-19), for task sets that list one in
# task_sets/<v>/tiers.jsonl (v3+). Display only: the pass bars above are unchanged and
# per-tier verdicts come from tools/analyze_run.py --tier + tools/combine_repeats.py.
# Each tier is its own board, never pooled; a player is shown on a tier only if it ran
# every task of that tier. `score_label: null` = no score is published for the tier;
# `score_term` = the glossary entry the tier's score column links to (default: the
# arena's primary column).
# (Not the difficulty `tier_pivot` below, which is group size.)
data_tiers:
  synthetic:
    label: "Synthetic"
    score_label: Accuracy
    note: "Constructed citing sentences with injected errors: the v2 task set's tasks, unchanged."
  rd-zhang2024:
    label: "Real citations: Zhang & Abernethy 2024"
    score_label: null
    note: "No score is shown. This dataset's labels were judged against the cited paper's full text, so on an abstract they only rule verdicts out. The scorer's number here is constraint agreement, and a player that answers 'silent' to every sentence would score 1.0. The tier is judged by its pre-registered bars instead (docs/design/2026-10-citeclaim-stage-d-real-data.md)."
  rd-scifact-dev:
    label: "Real claims: SciFact (dev)"
    score_label: "Accuracy (SciFact labels)"
    note: "Scientific claims with abstract-level human labels (SciFact dev split), one claim per task. A calibration tier: its pre-registered bars are reported in docs/design/2026-10-citeclaim-stage-d-real-data.md."
  rd-mmc-pilot:
    label: "Real citations: MetaMisCitations pilot"
    score_label: "Agreement with frontier labels"
    score_term: frontier_label_agreement
    note: "Real citing sentences. The labels come from frontier AI models (three-model consensus or a blind decider), not from human judges, so this is agreement with those labels, never accuracy (docs/design/2026-10-citeclaim-stage-e-mmc-pilot.md)."
tier_pivot:
  axis: group_size
  composite_formula: "item accuracy (guarded)"
  values:
    - {value: 1, label: G1, sub: one-sentence}
    - {value: 2, label: G2, sub: two-sentences}
    - {value: 3, label: G3, sub: three-sentences}
    - {value: 4, label: G4, sub: four-sentences}
    - {value: 5, label: G5, sub: five-sentences}
    - {value: 6, label: G6, sub: six-sentences}
