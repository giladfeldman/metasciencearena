arena_id: sprite-plausibility-v1
taxonomy_leaf_id: summary-stat-distribution-plausibility
version: 0.1.0
owner: gilad
license: MIT
input_artifact: summary_statistics_table
output_to_judge: list_of_sprite_plausibility_records
difficulty_axes:
  - {id: tier,     min: 1, max: 6, description: "1 clean/simple · 2 controls-only (false-alarm trap: extreme-but-POSSIBLE stats) · 3 single injected issue · 4 subtle issue · 5 multiple issues · 6 full composition"}
  - {id: n_issues, min: 0, max: 6, description: "How many statistics actually carry an injected impossible (mean, SD) combination in this task"}
task_set_versions:
  - {version: v1, n_tasks: 15, released_on: "2026-06-07"}
benchmark_splits:
  revealed: {seed: 0, published: true}
  private:
    seed_source: secret_file        # task_sets/v1/.private_seed (gitignored)
    real_holdout_dir: task_sets/v1/_held_out   # hand-curated real summary-stat tables (future)
  parity:
    match_axes: [tier]              # n_issues is a deterministic function of tier
    match_categories: true          # every injected impossibility kind must appear in both splits
    count_tolerance: 0.2            # small per-cell tolerance; assignment is deterministic
error_categories:
  - id: sprite_missed
    description: A statistic whose reported (mean, SD) is genuinely impossible for N integers in the response range was not flagged by the player (false negative).
    severity: major
  - id: sprite_false_alarm
    description: A statistic whose reported (mean, SD) is genuinely achievable (often an extreme-but-possible control) was flagged as impossible (false positive).
    severity: major
  - id: kind_mislabel
    description: A correctly-flagged statistic was given the wrong issue_kind (impossible_mean vs impossible_sd).
    severity: minor
display_columns:
  - {id: composite,     source: score.primary,                 label: Composite,     description: "The headline score (higher is better) for catching summary statistics (a mean and standard deviation) that no real data on the given scale could produce (the SPRITE test). It multiplies how well it finds the impossible pairs, whether it labels them correctly, and whether its confidence is honest, so weakness in any one drags it down (formula: detection_f1 × kind_accuracy × calibration).", direction: higher, format: f3, primary: true}
  - {id: detection_f1,  source: score.breakdown.detection_f1,  label: Detection F1,  description: "How well the player separated the genuinely-impossible mean/SD pairs from the achievable ones — balancing catching real violations against false alarms. Extreme-but-possible values are designed to tempt false alarms here.", direction: higher, format: f2, primary: false}
  - {id: kind_accuracy, source: score.breakdown.kind_accuracy, label: Kind acc.,     description: "Of the statistics it correctly flagged, the fraction labelled with the right problem type (an impossible mean vs an impossible standard deviation).", direction: higher, format: f2, primary: false}
  - {id: calibration,   source: score.breakdown.calibration,   label: Calibration,   description: "How honest the player's confidence is — a well-calibrated player that says it is 90% sure is right about 90% of the time. It punishes confidently-wrong calls.", direction: higher, format: f2, primary: false}
tier_pivot:
  axis: tier
  composite_formula: "detection_f1 × kind_accuracy × calibration"
  values:
    - {value: 1, label: T1, sub: clean-simple}
    - {value: 2, label: T2, sub: controls-trap}
    - {value: 3, label: T3, sub: single-issue}
    - {value: 4, label: T4, sub: subtle-issue}
    - {value: 5, label: T5, sub: multi-issue}
    - {value: 6, label: T6, sub: full-composition}
