arena_id: transparency-statements-v1
title: "Transparency Statements"
taxonomy_leaf_id: transparency-statement-detection
version: 0.1.0
owner: gilad
license: MIT
input_artifact: plain_text_section
output_to_judge: structured_field_map
difficulty_axes:
  - {id: tier,          min: 1, max: 6, description: "1 clean/simple · 2 paraphrase-consistent (false-alarm trap) · 3 single injected mistake · 4 subtle mistake · 5 multiple mistakes · 6 full composition"}
  - {id: n_mistakes,    min: 0, max: 5, description: "How many transparency-field mistakes are actually injected in this manuscript"}
task_set_versions:
  - {version: v1, n_tasks: 33, released_on: "2026-06-06"}
benchmark_splits:
  revealed: {seed: 0, published: true}
  private:
    seed_source: secret_file        # task_sets/v1/.private_seed (gitignored)
    real_holdout_dir: task_sets/v1/_held_out   # hand-coded real transparency sections (future)
  parity:
    match_axes: [tier]              # n_mistakes is a deterministic function of tier
    match_categories: true          # every mistake_kind must appear in both splits
    count_tolerance: 0              # mistake-kind assignment is index-cycled (seed-independent), so both splits hit the IDENTICAL matrix — exact parity
error_categories:
  - id: statement_missed
    description: A transparency statement that is truly present (COI, funding, or an open-practices availability claim) was not detected by the player (false negative).
    severity: major
  - id: statement_false_positive
    description: The player reported a transparency statement (e.g. a COI or funding statement) that is not actually present in the text (false positive).
    severity: major
  - id: url_misjudged
    description: A repository URL was misjudged — a real link treated as absent/on-request, or a placeholder/broken/on-request claim treated as a real available repository.
    severity: minor
display_columns:
  - {id: composite,     source: score.primary,                 label: Composite,     description: "The headline score (higher is better) for reading a paper's transparency statements — conflicts of interest, funding, and whether data/code/materials/preregistration are available. It multiplies how accurately it reads each field, whether it judges shared-link claims correctly, and whether its confidence is honest, so weakness in any one drags it down (formula: field_accuracy × url_judgement × calibration).", direction: higher, format: f3, primary: true}
  - {id: field_accuracy, source: score.breakdown.field_accuracy, label: Field acc.,    description: "Across the six transparency fields (COI, funding, data, code, materials, prereg), the average rate at which the player correctly read each one as present, absent, or available-on-request.", direction: higher, format: f2, primary: false}
  - {id: field_f1,      source: score.breakdown.field_f1,      label: Statement F1, description: "How well the player told present statements from absent ones across the six fields — balancing catching real statements against inventing ones. Reworded-but-real statements are designed to tempt false positives here.", direction: higher, format: f2, primary: false}
  - {id: url_judgement, source: score.breakdown.url_judgement, label: URL judge.,   description: "Of the availability claims, the fraction the player judged correctly — recognising a real working repository link versus a placeholder, broken link, or 'available on request' hedge.", direction: higher, format: f2, primary: false}
  - {id: calibration,   source: score.breakdown.calibration,   label: Calibration,   description: "How honest the player's confidence is — a well-calibrated player that says it is 90% sure is right about 90% of the time. It punishes confidently-wrong calls.", direction: higher, format: f2, primary: false}
tier_pivot:
  axis: tier
  composite_formula: "field_accuracy × url_judgement × calibration"
  values:
    - {value: 1, label: T1, sub: clean-simple}
    - {value: 2, label: T2, sub: paraphrase-trap}
    - {value: 3, label: T3, sub: single-mistake}
    - {value: 4, label: T4, sub: subtle-mistake}
    - {value: 5, label: T5, sub: multi-mistake}
    - {value: 6, label: T6, sub: full-composition}
