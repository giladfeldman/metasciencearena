arena_id: reference-integrity-v1
taxonomy_leaf_id: reference-integrity-checks
version: 0.1.0
owner: gilad
license: MIT
input_artifact: reference_list
output_to_judge: list_of_reference_integrity_records
difficulty_axes:
  - {id: tier,     min: 1, max: 6, description: "1 clean/simple · 2 controls-only (false-alarm trap, incl. confusable honest twins) · 3 single injected issue (cycles all 9 kinds) · 4 subtle issue beside its confusable clean twin · 5 multiple issues · 6 full composition"}
  - {id: n_issues, min: 0, max: 6, description: "How many references actually have an injected integrity issue in this task"}
task_set_versions:
  - {version: v1, n_tasks: 25, released_on: "2026-06-06"}
benchmark_splits:
  revealed: {seed: 0, published: true}
  private:
    seed_source: secret_file        # task_sets/v1/.private_seed (gitignored)
    real_holdout_dir: task_sets/v1/_held_out   # hand-curated real reference lists (future)
  parity:
    match_axes: [tier]              # n_issues is a deterministic function of tier
    match_categories: true          # every injected issue kind must appear in both splits
    count_tolerance: 0.2            # small per-cell tolerance; assignment is deterministic
error_categories:
  - id: integrity_missed
    description: A reference with a true integrity defect (retracted, mismatched, dangling, miscited, missing-replication, invalid-DOI, predatory-venue, tortured-phrase) was not flagged by the player (false negative).
    severity: major
  - id: integrity_false_alarm
    description: A clean reference (often a confusable control — an unusual-but-valid DOI, an obscure-but-reputable venue, or legitimate jargon) was flagged as having an integrity issue (false positive).
    severity: major
  - id: kind_mislabel
    description: A correctly-flagged reference was given the wrong issue_kind.
    severity: minor
display_columns:
  - {id: composite,     source: score.primary,                 label: Composite,     description: "The headline score (higher is better) for catching integrity problems in a reference list — retracted, mismatched, dangling, miscited, invalid-DOI, predatory-venue, or tortured-phrase sources. It multiplies how well it finds the bad references, whether it labels the problem correctly, and whether its confidence is honest, so weakness in any one drags it down (formula: detection_f1 × kind_accuracy × calibration).", direction: higher, format: f3, primary: true}
  - {id: detection_f1,  source: score.breakdown.detection_f1,  label: Detection F1,  description: "How well the player separated the truly-problematic references from the clean ones — balancing catching real issues against false alarms. Clean look-alike references are designed to tempt false alarms here.", direction: higher, format: f2, primary: false}
  - {id: kind_accuracy, source: score.breakdown.kind_accuracy, label: Kind acc.,     description: "Of the references it correctly flagged, the fraction it labelled with the right kind of problem (e.g. retracted vs mismatched).", direction: higher, format: f2, primary: false}
  - {id: calibration,   source: score.breakdown.calibration,   label: Calibration,   description: "How honest the player's confidence is — a well-calibrated player that says it is 90% sure is right about 90% of the time. It punishes confidently-wrong calls.", direction: higher, format: f2, primary: false}
tier_pivot:
  axis: tier
  composite_formula: "detection_f1 × kind_accuracy × calibration"
  values:
    - {value: 1, label: T1, sub: clean-simple}
    - {value: 2, label: T2, sub: controls-trap}
    - {value: 3, label: T3, sub: single-issue}
    - {value: 4, label: T4, sub: subtle-issue}
    - {value: 5, label: T5, sub: multi-issue}
    - {value: 6, label: T6, sub: full-composition}
