# Catalog of reference templates for reference-integrity-v1.
#
# Each entry is a "canonical" bibliographic record the generator KNOWS the truth
# of (it injected any defect itself, so no live retraction/metadata DB is needed).
# A reference is rendered into the task envelope either CLEAN (matches canonical)
# or with ONE injected integrity issue, depending on the tier/index plan.
#
# Fields:
#   authors / year / title / doi / venue : the CANONICAL values (what the record
#                                  *should* say). `venue` is the publication outlet
#                                  (a reputable journal); it is rendered for EVERY
#                                  reference so the predatory_source issue is a
#                                  same-shaped comparison against a clean venue.
#   replication_of               : (optional) when present, this entry is itself a
#                                  REPLICATION study of an original; used by the
#                                  replication_uncited issue (an original whose known
#                                  replication is absent from the reference list).
#   miscite_year / miscite_title : (optional) commonly-confused wrong values used to
#                                  render the miscitation issue (the reference *as listed*
#                                  carries a known-wrong attribution).
#   predatory_venue              : (optional) a known predatory / hijacked-style outlet
#                                  the generator substitutes for `venue` to inject the
#                                  predatory_source issue (the arena KNOWS — it injected
#                                  the substitution; no live Beall/DOAJ lookup needed).
#   tortured_title               : (optional) the SAME work's title rewritten with a
#                                  paper-mill "tortured phrase" (a synonym-swapped
#                                  paraphrase, e.g. "irregular esteem" for "random
#                                  value"); substituted for `title` to inject the
#                                  tortured_phrase issue. `title` remains the canonical
#                                  (legitimate) wording stored in gold.
