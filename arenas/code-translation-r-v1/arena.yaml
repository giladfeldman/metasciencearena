arena_id: code-translation-r-v1
title: "SPSS / Stata → R Translation"
taxonomy_leaf_id: statistical-syntax-translation-to-r
version: 0.1.0
owner: gilad
license: MIT
input_artifact: statistical_syntax_script
output_to_judge: translated_r_script
difficulty_axes:
  - {id: tier, min: 1, max: 9, description: "1 descriptives · 2 t-test (pooled-vs-Welch default) · 3 regression (listwise deletion) · 4 recode/user-missing/computed index · 5 factorial ANOVA (Type I vs Type III SS) · 6 multi-step pipeline (order-dependent filtering) · 7 correlations (pairwise vs listwise — the PAIR is the trap) · 8 frequency weighting (WEIGHT BY is stateful; base R has no weighting state) · 9 SPLIT FILE (stateful per-group execution with no R equivalent)"}
  - {id: source_language, min: 1, max: 2, description: "1 SPSS syntax (.sps) · 2 Stata do-file (.do). Every analysis is authored in BOTH languages, so the axis compares languages at matched difficulty rather than confounding them."}
task_set_versions:
  - {version: v1, n_tasks: 18, released_on: "2026-08-03"}
benchmark_splits:
  revealed: {seed: 0, published: true}
  private:
    seed_source: secret_file
    real_holdout_dir: task_sets/v1/_held_out
  parity:
    # The private split is a GENUINELY INDEPENDENT corpus (real third-party
    # scripts under `real_holdout_dir`), not the same generator under a secret
    # seed — so it cannot mirror the revealed tier x language grid, and forcing
    # it to would mean hand-picking real scripts to fit our template, which
    # would stop it being a holdout. Declaring parity we cannot honour is worse
    # than declaring none: the check would either fail forever or be quietly
    # relaxed until it proved nothing.
    #
    # `match_axes` is retained because the contract requires it, and it still
    # documents WHICH axes would be matched if this ever reverts to a seed-based
    # split. Revealed-split symmetry across players is unaffected and is what
    # `framework audit` actually gates.
    independent_holdout: true
    match_axes: [tier, source_language]
    match_categories: false
error_categories:
  - id: does_not_execute
    description: The emitted R failed to run at all — a syntax error, a call to a function that does not exist (a hallucinated API), a missing library, or a timeout. Nothing can be scored from it.
    severity: critical
  - id: wrong_statistic
    description: The R ran and produced a value, but the number differs from gold beyond tolerance — the translation computes a different quantity than the source script did.
    severity: critical
  - id: missing_statistic
    description: The R ran but never emitted one of the required gold statistics, so that quantity cannot be compared.
    severity: major
  - id: silent_semantic_drift
    description: A cross-language default was carried over unchanged and silently changed the result — Welch instead of pooled, Type I instead of Type III sums of squares, a user-missing code left as a literal value, or a filter applied in the wrong order. The script runs cleanly and looks right, which is what makes this the arena's central failure mode.
    severity: critical
  - id: wrong_variable_mapping
    description: The translation referenced the wrong column, or mapped a factor's levels incorrectly (e.g. reversed the group contrast), so the sign or grouping of the result is wrong.
    severity: major
display_columns:
  - {id: composite, source: score.primary, label: Composite, description: "The headline score (higher is better) for turning an SPSS or Stata analysis script into R that genuinely reproduces it. The emitted R is actually executed against the same dataset and its numbers are compared to gold, so code that merely looks plausible scores near zero. It combines whether the code runs, how many of the required statistics it got right, and how close the numbers are (formula: execution_rate × statistic_accuracy).", direction: higher, format: f3, primary: true}
  - {id: execution_rate, source: score.breakdown.execution_rate, label: Runs, description: "Whether the emitted R executed at all against the fixed dataset — no syntax errors, no calls to functions that do not exist, no timeout. A tool that emits confident-looking but unrunnable code scores 0 here.", direction: higher, format: f2, primary: false}
  - {id: statistic_accuracy, source: score.breakdown.statistic_accuracy, label: Stats acc., description: "Of the statistics the source script produces, the fraction the translation reproduced within tolerance. This is where silent mistranslations surface: the code runs fine but the number is wrong because a language default (pooled vs Welch, Type I vs Type III) was carried over unchanged.", direction: higher, format: f2, primary: false}
  - {id: n_statistics_matched, source: score.breakdown.n_statistics_matched, label: Matched, description: "The raw count of gold statistics reproduced within tolerance, for reading alongside the accuracy rate.", direction: higher, format: int, primary: false}
tier_pivot:
  axis: tier
  composite_formula: "execution_rate × statistic_accuracy"
  values:
    - {value: 1, label: T1, sub: descriptives}
    - {value: 2, label: T2, sub: ttest-pooled-vs-welch}
    - {value: 3, label: T3, sub: regression-listwise}
    - {value: 4, label: T4, sub: recode-user-missing}
    - {value: 5, label: T5, sub: anova-ss-type}
    - {value: 6, label: T6, sub: pipeline-order}
    - {value: 7, label: T7, sub: corr-pairwise-vs-listwise}
    - {value: 8, label: T8, sub: weight-by-state}
    - {value: 9, label: T9, sub: split-file-state}
