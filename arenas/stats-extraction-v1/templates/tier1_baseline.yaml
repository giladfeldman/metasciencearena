# Tier 1: clean APA-formatted inline stats. {value}, {p}, {df1}, {df2}, {ci_lo}, {ci_hi}, {es}, {es_label} are placeholders.
nhst:
  - "Participants improved on the task, t({df1}) = {value}, p = {p}."
  - "We observed an effect, F({df1}, {df2}) = {value}, p = {p}."
  - "There was a correlation, r({df1}) = {value}, p = {p}."
  - "Group differences were significant, chi2({df1}) = {value}, p = {p}."
effect_size:
  - "The effect was {es_label} = {es}, 95% CI [{ci_lo}, {ci_hi}]."
  - "We found a sizeable effect ({es_label} = {es})."
ci_only:
  - "The mean difference was 0.42, 95% CI [{ci_lo}, {ci_hi}]."
# Matched clean control for the tier-5 nhst_inconsistent deception: a fully
# coherent result where {stat_str} carries the correct label + df-arity and {p}
# is the recomputed two-sided p. A player that recomputes p finds no discrepancy,
# so this must NOT be flagged. {stat_str} is pre-rendered in code (e.g. "F(3, 57)
# = 9.12") so the df count matches the test.
nhst_consistent:
  - "The effect was statistically reliable, {stat_str}, p = {p}."
  - "As predicted, the test was significant, {stat_str}, p = {p}."
# Matched clean control for the tier-5 effect_size_rounding deception: a correctly
# rounded effect size whose point estimate ({es}) equals its CI midpoint
# ((ci_lo+ci_hi)/2). Same shape as the deception (estimate + symmetric 95% CI) but
# internally consistent, so a player recomputing the midpoint finds no discrepancy
# and must NOT flag it.
clean_es:
  - "The estimate was well determined, {es_label} = {es}, 95% CI [{ci_lo}, {ci_hi}]."
  - "Consistent with expectations, {es_label} = {es} (95% CI [{ci_lo}, {ci_hi}])."
