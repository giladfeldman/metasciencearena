notes: |
  Computed-gold dual-benchmark p-curve arena (evidential-value of a set of significant
  findings via the Simonsohn, Nelson & Simons (2014) right-skew test). The REVEALED
  split is generated on-the-fly from (task_set_version="v1", seed=0); the PRIVATE split
  uses the secret seed in task_sets/v1/.private_seed (gitignored) plus any hand-curated
  real significant-findings sets under _held_out/. Gold is regenerated from the seed
  (no committed answer key, no external registry) — see generator.ground_truth(). Both
  splits cover the same tier matrix and both constructed labels
  (evidential/no-evidential); tools/check_parity.py enforces it. Reference player: a
  faithful pure-R implementation of the Simonsohn et al. (2014) p-curve
  (players/adapters/pcurve.R). DISTINCT from zcurve-evidential-v1 (which fits a z-curve
  EM mixture for expected discovery/replicability rate); p-curve tests the right-skew
  of the significant p-values.
