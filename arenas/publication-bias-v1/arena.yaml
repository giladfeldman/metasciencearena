arena_id: publication-bias-v1
taxonomy_leaf_id: meta-analysis-publication-bias
version: 0.1.0
owner: gilad
license: MIT
input_artifact: meta_analytic_dataset
output_to_judge: publication_bias_verdict
difficulty_axes:
  - {id: tier, min: 1, max: 6, description: "1 small-k clean vs strong-biased · 2 controls-only (heterogeneous-but-clean false-alarm trap) · 3 null-effect clean vs biased (k=20) · 4 heterogeneous clean vs biased (k=24) · 5 large-k clean vs biased (k=32) · 6 largest-k clean vs biased (k=40)"}
  - {id: k,    min: 10, max: 40, description: "Number of studies in the meta-analytic set (>=10 so Egger is meaningful)."}
task_set_versions:
  - {version: v1, n_tasks: 12, released_on: "2026-06-08"}
benchmark_splits:
  revealed: {seed: 0, published: true}
  private:
    seed_source: secret_file        # task_sets/v1/.private_seed (gitignored)
    real_holdout_dir: task_sets/v1/_held_out   # hand-curated real meta-analytic datasets (future)
  parity:
    match_axes: [tier]              # k and label are deterministic functions of tier
    match_categories: true          # both constructed labels (biased/unbiased) appear in both splits
    count_tolerance: 0.2
error_categories:
  - id: bias_missed
    description: A set that genuinely shows small-study/publication bias (funnel asymmetry, Egger p far below threshold) was judged unbiased (false negative).
    severity: major
  - id: bias_false_alarm
    description: A symmetric / unbiased set (often a heterogeneous-but-clean control that merely looks noisy) was flagged as biased (false positive).
    severity: major
display_columns:
  - {id: primary,     source: score.primary,             label: Score,        description: "The headline score (higher is better) for judging whether a meta-analysis shows publication bias — the tendency for small or null studies to go unpublished, inflating the pooled effect. It is mostly about getting the verdict right (85%) plus a bit for honest confidence (15%); a correct, confident player scores 1.0.", direction: higher, format: f3, primary: true}
  - {id: correct,     source: score.breakdown.correct,   label: Correct,      description: "Whether the player's bias verdict matched the true label for the dataset (1.0 = right, 0.0 = wrong).", direction: higher, format: f2, primary: false}
  - {id: calibration, source: score.breakdown.calibration, label: Calibration, description: "How honest the player's confidence is — how closely its stated certainty matches whether it was actually right. It rewards confidence aligned with being correct.", direction: higher, format: f2, primary: false}
tier_pivot:
  axis: tier
  composite_formula: "0.85 × correct + 0.15 × calibration"
  values:
    - {value: 1, label: T1, sub: smallk-clean-vs-biased}
    - {value: 2, label: T2, sub: controls-trap}
    - {value: 3, label: T3, sub: null-effect}
    - {value: 4, label: T4, sub: heterogeneous}
    - {value: 5, label: T5, sub: large-k}
    - {value: 6, label: T6, sub: largest-k}
