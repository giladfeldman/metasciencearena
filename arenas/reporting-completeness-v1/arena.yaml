arena_id: reporting-completeness-v1
title: "Reporting Completeness"
taxonomy_leaf_id: statistical-reporting-completeness
version: 0.1.0
owner: gilad
license: MIT
input_artifact: plain_text_section
output_to_judge: list_of_reporting_completeness_records
difficulty_axes:
  - {id: tier,      min: 1, max: 6, description: "1 clean/simple · 2 complete-but-busy (false-alarm trap) · 3 single injected defect · 4 subtle defect · 5 multiple defects · 6 full composition"}
  - {id: n_defects, min: 0, max: 12, description: "How many completeness defects are actually injected in this task (0 for T1/T2)."}
task_set_versions:
  - {version: v1, n_tasks: 30, released_on: "2026-06-06"}
benchmark_splits:
  revealed: {seed: 0, published: true}
  private:
    seed_source: secret_file        # task_sets/v1/.private_seed (gitignored)
    real_holdout_dir: task_sets/v1/_held_out   # hand-coded real results sections (future)
  parity:
    match_axes: [tier]              # n_defects is a deterministic function of tier
    match_categories: true          # every defect kind must appear in both splits
    count_tolerance: 0.2            # small per-cell counts; allow modest slack
error_categories:
  - id: flag_missed
    description: A genuinely injected completeness defect was not flagged by the player (false negative).
    severity: major
  - id: flag_false_alarm
    description: The player flagged a span that is reported completely and precisely (false positive). The T2 trap punishes this.
    severity: major
  - id: category_mislabel
    description: The player flagged the right span but assigned the wrong completeness-defect category.
    severity: minor
display_columns:
  - {id: composite,    source: score.primary,                label: Composite,    description: "The headline score (higher is better) for catching incomplete statistical reporting (e.g. a test statistic with no degrees of freedom, or a p-value with no effect size). It multiplies how well it finds the gaps by whether its confidence is honest, so weakness in either drags it down (formula: detection_f1 × calibration).", direction: higher, format: f3, primary: true}
  - {id: detection_f1, source: score.breakdown.detection_f1, label: Detection F1, description: "How well the player found the real reporting gaps without false alarms — balancing catching genuine defects against flagging passages that are actually reported completely.", direction: higher, format: f2, primary: false}
  - {id: precision,    source: score.breakdown.precision,    label: Precision,    description: "Of the gaps the player flagged, the fraction that were real (matching a true defect in category and location). Low precision means it cried wolf.", direction: higher, format: f2, primary: false}
  - {id: recall,       source: score.breakdown.recall,       label: Recall,       description: "Of the real reporting gaps, the fraction the player caught. Low recall means it let incomplete reporting slip through.", direction: higher, format: f2, primary: false}
  - {id: calibration,  source: score.breakdown.calibration,  label: Calibration,  description: "How honest the player's confidence is — a well-calibrated player that says it is 90% sure is right about 90% of the time. It punishes confidently-wrong calls.", direction: higher, format: f2, primary: false}
tier_pivot:
  axis: tier
  composite_formula: "detection_f1 × calibration"
  values:
    - {value: 1, label: T1, sub: clean-simple}
    - {value: 2, label: T2, sub: false-alarm-trap}
    - {value: 3, label: T3, sub: single-defect}
    - {value: 4, label: T4, sub: subtle-defect}
    - {value: 5, label: T5, sub: multi-defect}
    - {value: 6, label: T6, sub: full-composition}
