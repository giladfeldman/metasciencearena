notes: |
  Dual-benchmark arena. The REVEALED split is generated on-the-fly from
  (task_set_version="v1", seed=0); the PRIVATE split uses the secret seed in
  task_sets/v1/.private_seed (gitignored) plus any hand-curated real results
  sections under _held_out/. Gold is regenerated from the seed (no committed
  answer key, no external registry) — see generator.ground_truth(). Both splits
  cover the same tier matrix and the full set of completeness-defect categories
  (missing_effect_size, imprecise_p, impossible_p_zero, missing_ci, missing_df,
  nonsig_as_support, unspecified_test, no_correction, percent_count_mismatch);
  tools/check_parity.py enforces it.
