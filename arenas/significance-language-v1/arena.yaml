arena_id: significance-language-v1
title: "Significance Language"
taxonomy_leaf_id: marginal-significance-and-spin-language
version: 0.1.0
owner: gilad
license: MIT
input_artifact: plain_text_section
output_to_judge: list_of_flagged_spans
difficulty_axes:
  - {id: tier,    min: 1, max: 6, description: "1 clean/simple · 2 controls-only paraphrase (false-alarm trap) · 3 single injected mistake · 4 subtle (mistake beside its look-alike clean control) · 5 multiple mistakes · 6 full composition"}
  - {id: n_flags, min: 0, max: 6, description: "How many interpretive-language problems are actually present (0 for T1/T2)."}
task_set_versions:
  - {version: v1, n_tasks: 21, released_on: "2026-06-06"}
benchmark_splits:
  revealed: {seed: 0, published: true}
  private:
    seed_source: secret_file        # task_sets/v1/.private_seed (gitignored)
    real_holdout_dir: task_sets/v1/_held_out   # hand-coded real manuscript excerpts (future)
  parity:
    match_axes: [tier]              # n_flags is a deterministic function of tier
    match_categories: true          # every injected mistake_kind must appear in both splits
    count_tolerance: 0.2
error_categories:
  - id: flag_missed
    description: A genuine interpretive-language problem present in the text was not flagged (false negative).
    severity: major
  - id: flag_false_alarm
    description: A clean, legitimate phrase (hedging / exact-significant / randomised-causal) was flagged as a problem (false positive). The T2 trap punishes this.
    severity: major
  - id: category_mislabel
    description: A correctly-localised flag was given the wrong category (e.g. spin labelled as marginal_significance).
    severity: minor
display_columns:
  - {id: composite,          source: score.primary,                     label: Composite,    description: "The headline score (higher is better) for catching misleading interpretive language — calling a non-significant result 'marginally significant', or spinning a weak finding as strong. It multiplies how well it locates the offending phrases by whether its confidence is honest, so weakness in either drags it down (formula: span_f1 × calibration).", direction: higher, format: f3, primary: true}
  - {id: f1,                 source: score.breakdown.f1,                label: Span F1,      description: "How well the player pinpointed the problem phrases in the text — balancing catching the real ones against flagging legitimate, careful wording. Innocent hedging is designed to tempt false alarms here.", direction: higher, format: f2, primary: false}
  - {id: category_accuracy,  source: score.breakdown.category_accuracy, label: Category acc., description: "Of the phrases it correctly located, the fraction it labelled with the right kind of problem (e.g. marginal-significance vs spin).", direction: higher, format: f2, primary: false}
  - {id: calibration,        source: score.breakdown.calibration,       label: Calibration,  description: "How honest the player's confidence is — a well-calibrated player that says it is 90% sure is right about 90% of the time. It punishes confidently-wrong calls.", direction: higher, format: f2, primary: false}
tier_pivot:
  axis: tier
  composite_formula: "span_f1 × calibration"
  values:
    - {value: 1, label: T1, sub: clean-simple}
    - {value: 2, label: T2, sub: controls-only-trap}
    - {value: 3, label: T3, sub: single-mistake}
    - {value: 4, label: T4, sub: subtle-lookalike}
    - {value: 5, label: T5, sub: multi-mistake}
    - {value: 6, label: T6, sub: full-composition}
