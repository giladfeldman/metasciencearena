arena_id: effect-size-conversion-v1
title: "Effect-Size Conversion"
taxonomy_leaf_id: effect-size-conversion
version: 0.1.0
owner: gilad
license: MIT
input_artifact: effect_size_conversion_request
output_to_judge: converted_effect_size
difficulty_axes:
  - {id: tier, min: 1, max: 6, description: "1 simple d<->r · 2 round-trip controls (d<->OR, eta2<->f) · 3 every pairwise no-context conversion · 4 conversions needing group sizes (d<->r with n1,n2) · 5 extreme-but-valid magnitudes · 6 small-magnitude mix"}
  - {id: needs_context, min: 0, max: 1, description: "Whether the conversion consumes group sizes (n1,n2) from context (1) or is context-free (0)."}
task_set_versions:
  - {version: v1, n_tasks: 22, released_on: "2026-06-08"}
benchmark_splits:
  revealed: {seed: 0, published: true}
  private:
    seed_source: secret_file        # task_sets/v1/.private_seed (gitignored)
    real_holdout_dir: task_sets/v1/_held_out   # hand-curated real conversion cases (future)
  parity:
    match_axes: [tier]              # the (from,to) conversion kinds are deterministic functions of tier
    match_categories: true          # every conversion kind appears in both splits
    count_tolerance: 0.2
error_categories:
  - id: conversion_error
    description: The converted value is outside the metric-scaled tolerance of the gold (the closed-form conversion the deterministic tool produces). Usually a wrong constant (e.g. the d->OR pi/sqrt(3) scaling) or the wrong d<->r / f<->eta2 identity.
    severity: major
display_columns:
  - {id: primary,     source: score.primary,               label: Score,        description: "The headline score (higher is better) for converting one effect-size metric into another (e.g. Cohen's d into a correlation r, or eta-squared into f). It is mostly about landing on the right number (85%) plus a bit for honest confidence (15%); a correct, confident player scores 1.0.", direction: higher, format: f3, primary: true}
  - {id: agreement,   source: score.breakdown.agreement,   label: Agreement,    description: "How close the player's converted value is to the correct answer — full credit inside an acceptable tolerance, then falling off the further away it lands.", direction: higher, format: f2, primary: false}
  - {id: calibration, source: score.breakdown.calibration, label: Calibration,  description: "How honest the player's confidence is — how closely its stated certainty matches whether its answer actually landed within tolerance. It rewards confidence aligned with being correct.", direction: higher, format: f2, primary: false}
tier_pivot:
  axis: tier
  composite_formula: "0.85 × agreement + 0.15 × calibration"
  values:
    - {value: 1, label: T1, sub: simple-d-r}
    - {value: 2, label: T2, sub: roundtrip-controls}
    - {value: 3, label: T3, sub: all-pairwise}
    - {value: 4, label: T4, sub: needs-context}
    - {value: 5, label: T5, sub: extreme-magnitude}
    - {value: 6, label: T6, sub: small-magnitude-mix}
